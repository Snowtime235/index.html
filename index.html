let activeId = "RED";
let chartInstance = null;

function formatPeriodoLabel(codigo) {
    const match = String(codigo).match(/^P(\d+)$/i);
    return match ? `Período ${match[1]}` : codigo;
}

function renderSidebar() {
    const nav = document.getElementById("sidebar_nav");
    let html = `<div class="nav-item ${activeId === 'RED' ? 'active' : ''}" onclick="selectLocal('RED')"><i class="fa-solid fa-chart-line"></i> Red Global</div>`;
    localesData.forEach(loc => {
        html += `<div class="nav-item ${activeId === loc.id ? 'active' : ''}" data-name="${loc.nombre.toLowerCase()}" onclick="selectLocal('${loc.id}')"><i class="fa-solid fa-store"></i> ${loc.nombre}</div>`;
    });
    nav.innerHTML = html;
}

function filterLocales() {
    const query = document.getElementById("search_input").value.toLowerCase();
    const items = document.querySelectorAll("#sidebar_nav .nav-item");
    items.forEach(item => {
        const name = item.getAttribute("data-name");
        if(!name) return;
        item.style.display = name.includes(query) ? "flex" : "none";
    });
}

function selectLocal(id) {
    activeId = id;
    renderSidebar();
    renderContent();
}

function buildTableHTML(title, icon, dataList, showDelta = false) {
    let rows = "";

    // Limitamos estrictamente a un máximo de 5 elementos únicos por tabla
    const limitedList = dataList.slice(0, 5);

    limitedList.forEach(item => {
        let deltaHtml = "";
        if(showDelta) {
            let cls = item.delta_sem >= 0 ? "delta-pos" : "delta-neg";
            let sign = item.delta_sem > 0 ? "+" : "";
            deltaHtml = `<td class="badge-delta ${cls}">${sign}${item.delta_sem} pts</td>`;
        } else {
            deltaHtml = `<td>N° ${item.rank}</td>`;
        }

        rows += `
            <tr>
                <td>${item.local}</td>
                <td><span class="badge-nps">${item.nps}</span></td>
                ${deltaHtml}
            </tr>
        `;
    });

    return `
        <div class="ranking-table-wrapper">
            <div class="ranking-table-title"><i class="${icon}"></i> ${title}</div>
            <table class="ranking-table">
                <thead>
                    <tr><th>Local</th><th>NPS</th><th>${showDelta ? 'Var. Semanal' : 'Ranking'}</th></tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="3" style="text-align:center; color:#5C6E84;">Sin registros válidos este periodo</td></tr>'}</tbody>
            </table>
        </div>
    `;
}

function renderContent() {
    const container = document.getElementById("content_container");
    let data = activeId === "RED" ? globalData : localesData.find(l => l.id === activeId);
    let esRed = activeId === "RED";

    let periodosHtml = '<div class="period-timeline">';
    periodosData.forEach(p => {
        let cls = p.latest ? 'class="period-badge latest"' : 'class="period-badge"';
        periodosHtml += `<div ${cls}><span class="p-code">${formatPeriodoLabel(p.codigo)}</span><span class="p-dates">${p.inicio} / ${p.fin}</span></div>`;
    });
    periodosHtml += '</div>';

    if(esRed) {
        let tablaMejores = buildTableHTML("Mejores Locales (Última Semana)", "fa-solid fa-crown", topLocalesData.mejores, false);
        let tablaPeores = buildTableHTML("Peores Locales (Última Semana)", "fa-solid fa-triangle-exclamation", topLocalesData.peores, false);
        let tablaSubidas = buildTableHTML("Mayores Subidas (Última Semana)", "fa-solid fa-arrow-trend-up", topLocalesData.subidas, true);
        let tablaCaidas = buildTableHTML("Mayores Caídas (Última Semana)", "fa-solid fa-arrow-trend-down", topLocalesData.caidas, true);

        container.innerHTML = `
            <div class="header-block"><h1>${data.nombre}</h1></div>
            ${periodosHtml}
            <div class="report-card">
                <div class="section-title"><i class="fa-solid fa-square-poll-vertical"></i> ¿CÓMO LE FUE A LA RED DE LOCALES EN LA ÚLTIMA SEMANA?</div>
                <div class="section-text">${data.comoLeFue}</div>
            </div>
            <div class="chart-container"><canvas id="evolutivoChart"></canvas></div>

            <div class="section-title" style="margin-top:24px;"><i class="fa-solid fa-list-ol"></i> Desempeño Destacado de Unidades en el Periodo</div>
            <div class="ranking-grid">${tablaMejores}${tablaPeores}</div>
            <div class="ranking-grid">${tablaSubidas}${tablaCaidas}</div>

            <div class="report-card">
                <div class="section-title"><i class="fa-solid fa-bullseye"></i> ¿DÓNDE HAY QUE PONER EL FOCO?</div>
                <div class="section-text">${data.dondePonerFoco}</div>
                <div class="section-title" style="margin-top:40px;"><i class="fa-solid fa-list-check"></i> ¿DÓNDE SE DEBEN CONCENTRAR LAS PRIORIDADES DE GESTIÓN?</div>
                <div class="section-text">${data.prioridadesGestion}</div>
            </div>
        `;
    } else {
        container.innerHTML = `
            <div class="header-block"><h1>Local ${data.nombre}</h1></div>
            ${periodosHtml}
            <div class="report-card">
                <div class="section-title"><i class="fa-solid fa-circle-info"></i> ¿CÓMO LE FUE AL LOCAL EN LA ÚLTIMA SEMANA?</div>
                <div class="section-text">${data.comoLeFue}</div>
            </div>
            <div class="chart-container"><canvas id="evolutivoChart"></canvas></div>
            <div class="report-card">
                <div class="section-title"><i class="fa-solid fa-bullseye"></i> ¿DÓNDE HAY QUE PONER EL FOCO?</div>
                <div class="section-text">${data.dondePonerFoco}</div>
            </div>
        `;
    }
    setTimeout(() => initChart(data.kpiEvolutivo), 50);
}

function initChart(valores) {
    const ctx = document.getElementById('evolutivoChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: periodosData.map(p => formatPeriodoLabel(p.codigo)),
            datasets: [{
                data: valores,
                borderColor: '#1DAFAD',
                backgroundColor: 'rgba(29, 175, 173, 0.10)',
                borderWidth: 3,
                pointBackgroundColor: '#121B5A',
                pointBorderColor: '#1DAFAD',
                pointBorderWidth: 2,
                pointRadius: 5,
                fill: true,
                tension: 0.15
            }]
        },
        plugins: [ChartDataLabels],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                datalabels: {
                    anchor: 'end', align: 'top', backgroundColor: '#121B5A', color: '#FFFFFF', borderRadius: 4,
                    font: { family: 'Barlow', weight: '600', size: 12 }, padding: 6,
                    formatter: (v) => v.toFixed(1) + ' pts'
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { font: { family: 'Barlow', size: 13, weight: '500' }, color: '#595959' } },
                y: { 
                    grid: { color: 'rgba(18, 27, 90, 0.06)' }, border: { dashed: [4, 4] }, 
                    ticks: { font: { family: 'Barlow', size: 12 }, color: '#595959' },
                    suggestedMin: Math.min(...valores) - 10, suggestedMax: Math.max(...valores) + 10
                }
            }
        }
    });
}

window.onload = function() {
    renderSidebar();
    renderContent();
};
</script>
