os y estacionales con seguimiento semanal.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 39,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a precios poco legibles, productos sin precio y diferencias entre el valor en góndola y el cobro en caja, lo que genera fricción y desconfianza. Se sugiere ejecutar una revisión diaria de etiquetado y flejes, más un control de coherencia góndola-caja en ofertas activas antes de los horarios de mayor flujo.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 49,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten comentarios sobre percepción de alzas y comparación desfavorable con otros retailers en algunos productos, además de dudas por múltiples precios para un mismo ítem. Se sugiere priorizar señalización más notoria de precios y ofertas reales, y activar chequeos de consistencia de precios en sala para evitar dobles lecturas y reclamos en caja.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 50,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a carnes en mal estado y dudas sobre frescura, lo que impacta directamente la confianza en la compra de perecibles. Se sugiere reforzar controles de calidad por lote y vitrina, con retiro preventivo y revisión de cadena de frío en horarios de alta rotación.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 47,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aunque hay comentarios positivos, aparece alguna mención a falta de carros y a carros sucios, lo que deteriora la experiencia desde el inicio del recorrido. Se sugiere asegurar un circuito de recuperación y limpieza de carros por turnos, con responsable asignado en horas punta y reposición desde estacionamientos hacia accesos."}, {"id": "0049", "nombre": "0049 Quilicura", "kpiEvolutivo": [60.7, 44.7, 43.4, 33.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 33,3 pts</strong>, bajando -10,1 pts respecto a la semana previa y ubicándose en el lugar 75 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -27,4 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. La trayectoria muestra una contracción que no logró ser compensada en los cortes intermedios, dejando al indicador en un nivel que exige contención operativa y recuperación consistente.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 30,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Se repiten menciones a filas enormes, pocas cajas abiertas, lentitud en cajas y demoras relevantes, además de fricciones en autoservicio que obligan a pedir ayuda o alargan el pago. Se sugiere reforzar dotación y apertura de cajas en horas punta, asegurar apoyo activo en autoservicio y ordenar un plan de contingencia para picos de demanda.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 42,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones a precios altos y, sobre todo, a diferencias entre el precio en góndola y el cobro en caja, lo que genera reclamos y obliga a verificaciones que además ralentizan la atención. Se sugiere ejecutar controles diarios de etiquetado y coherencia góndola-caja, con responsables por sala y corrección rápida antes de los horarios de mayor flujo.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 44,0 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Algunos comentarios apuntan a promociones poco claras o descuentos que no se respetan al pagar, lo que termina en validaciones en caja y una experiencia más tensa. Se sugiere simplificar y estandarizar la señalética de ofertas, validar activaciones en sistema antes de abrir sala y habilitar un protocolo corto de resolución en caja para no extender filas."}, {"id": "0052", "nombre": "0052 Grecia", "kpiEvolutivo": [47.2, 39.0, 36.2, 52.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 52,8 pts</strong>, subiendo +16,6 pts respecto a la semana previa y ubicándose en el lugar 12 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,9 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se observa una tendencia al alza con comportamiento volátil, donde pese a semanas con oscilaciones la gestión logró consolidar una mejora real en el balance</strong>, acumulando un repunte de +5,6 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo que confirma una recuperación efectiva en la experiencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 40,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a poca variedad y a que, por ser un formato express, “no siempre encuentras todo lo que necesitas”, incluyendo quiebres en categorías específicas. Se sugiere reforzar el surtido mínimo por misión de compra y asegurar reposición de los top más buscados, con revisión diaria de quiebres y sustitutos visibles en sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 46,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. En comentarios aparece de forma recurrente el “agotado/no había” y la sensación de stock inconsistente según el día, además de casos donde el cliente termina resolviendo en otros locales cercanos. Se sugiere atacar quiebres recurrentes con alertas simples de reposición, control de góndola en horas punta y confirmación temprana de sustituciones cuando aplique.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 79,1 pts en la última semana. Este atributo fue priorizado porque se incluye por su peso relativo dentro de los atributos evaluados. Aunque el nivel es alto, aparecen menciones puntuales a problemas en perecibles específicos, como huevos en mal estado, carne en mal estado o falta de refrigeración en bebidas alcohólicas, que pueden dañar la confianza. Se sugiere reforzar controles de temperatura y rotación, y asegurar un protocolo de revisión y retiro rápido ante reclamos de calidad en sala."}, {"id": "0053", "nombre": "0053 Coquimbo", "kpiEvolutivo": [59.3, 51.5, 48.3, 13.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 13,3 pts</strong>, bajando -34,9 pts respecto a la semana previa y ubicándose en el lugar 101 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,4 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -45,9 pts frente a la primera semana analizada. Este retroceso se confirma como estadísticamente significativo y refleja contracciones que no lograron ser compensadas en los cortes intermedios, dejando al indicador en un nivel muy exigente para la gestión del local.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 2,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a faltantes de productos y problemas de stock, incluyendo casos puntuales de productos específicos no disponibles. Se sugiere reforzar reposición y quiebres con revisión diaria de top faltantes, ajuste de pedidos y control en sala para asegurar presencia en góndola.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 2,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece de forma recurrente la percepción de poca variedad de marcas y formatos, junto con un surtido más limitado que antes. Se sugiere levantar categorías con mayor reclamo de variedad y asegurar amplitud mínima por marca y formato, con seguimiento semanal de cumplimiento en sala.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 29,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a carnes y pollo en mal estado, olores y devoluciones, lo que tensiona la confianza en perecibles. Se sugiere reforzar control de cadena de frío, rotación FEFO, revisión de mermas y retiro preventivo de productos con riesgo, con chequeos por turno en vitrinas y cámaras.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 29,4 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a lentitud en cajas y falta de control de filas en horarios peak, aunque también se observan comentarios positivos sobre cajas rápidas y autoservicio cuando están bien operativas. Se sugiere ajustar dotación y apertura de cajas por franja horaria, asignar apoyo de piso para ordenar filas y asegurar continuidad operativa de cajas rápidas y autoservicio en momentos de mayor flujo.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 41,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios se menciona que algunas ofertas se perciben acotadas a pocas marcas y también aparecen reclamos por alzas de precios y menor presencia de buenas promociones. Se sugiere mejorar señalética en sala y consistencia de precios en góndola versus caja, además de reforzar comunicación de ofertas vigentes por categoría para reducir confusión y frustración en la compra.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 41,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Si bien hay varios comentarios positivos, aparecen menciones a malos tratos puntuales y experiencias tensas en caja o en interacciones específicas. Se sugiere reforzar estándares de trato y contención en momentos de alta demanda, con retroalimentación en terreno y seguimiento de casos para evitar recurrencia.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. En comentarios se repiten menciones a precios convenientes, pero también aparece la percepción de alzas recientes y comparación desfavorable en algunos productos versus otros supermercados. Se sugiere monitorear semanalmente una canasta de productos sensibles y asegurar correcta ejecución de precios y descuentos en caja para sostener la percepción de conveniencia.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a carros en mal estado y a dificultades para encontrarlos o gestionarlos en accesos, lo que afecta el inicio de la experiencia. Se sugiere implementar rondas de orden y reposición de carros por horario, mantenimiento preventivo y puntos de acopio visibles en accesos clave."}, {"id": "0054", "nombre": "0054 Vicuña Mackenna", "kpiEvolutivo": [39.6, 46.7, 46.8, 41.8], "comoLeFue": "El local cerró la última semana con un NPS de 41,8 pts, bajando -5,0 pts respecto a la semana previa y ubicándose en el lugar 43 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En el balance de las últimas 4 semanas, el local muestra una trayectoria de mejora moderada y sostenida en el cierre, aunque sin consolidar un cambio estadísticamente significativo.</strong> En concreto, el indicador termina con una variación neta de +2,2 pts frente a la primera semana analizada, un avance que no alcanza significancia estadística y que sugiere que la recuperación aún es frágil y dependiente de la ejecución semanal.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 35,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a filas, pocas cajas habilitadas, lentitud en cajas y fricción en autoservicio por falta de apoyo o desorden en las filas. Se sugiere reforzar dotación y supervisión en horas punta, ordenar la fila única para autoservicio y asegurar apoyo activo en autocajas para destrabar incidencias en el momento.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 33,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Algunos comentarios apuntan a quiebres de stock, sustituciones no deseadas o falta de reposición, incluyendo casos en compra por app donde no llega todo lo pedido. Se sugiere ajustar reposición en categorías sensibles y fines de semana, mejorar la comunicación de sustituciones en sala y en picking, y activar revisión diaria de top quiebres con responsables por sección.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 38,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a menor variedad que antes y faltantes en segmentos específicos como sin gluten, vegetarianos o ciertas categorías que el cliente espera encontrar de forma consistente. Se sugiere definir un mínimo de surtido por misión de compra en categorías reclamadas, mejorar la señalización de secciones especiales y asegurar reposición visible para evitar la percepción de “poca variedad” por góndolas incompletas.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 48,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a promociones poco claras o que no se reflejan en caja, diferencias de precio entre sala y cobro, y percepción de “ofertas” que no se sienten como descuento real. Se sugiere reforzar control de flejes y precios en caja con chequeos por turno, simplificar la comunicación de mecánicas y activar un protocolo rápido de resolución en línea de cajas para evitar anulaciones y frustración.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 53,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece sensibilidad a alzas, comparación con otras sucursales cercanas y la idea de que solo conviene comprar con “oferta”. Se sugiere asegurar consistencia de precios en básicos de alta visibilidad, reforzar cartelería de “precio líder” en productos clave y revisar semanalmente reclamos de sobreprecio o diferencias sala-caja para corregir rápido."}, {"id": "0055", "nombre": "0055 Macul", "kpiEvolutivo": [41.8, 43.5, 44.4, 39.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 39,4 pts</strong>, bajando -5,0 pts respecto a la semana previa y ubicándose en el lugar 55 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>A lo largo de las últimas 4 semanas la gestión ha mostrado una trayectoria plana y lineal, consolidando un escenario de estancamiento o inmovilidad estructural en la experiencia del cliente</strong>, donde el indicador cierra con una variación marginal de -2,3 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística y que no altera el balance operacional.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 36,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Algunos comentarios apuntan a que, si bien se encuentra lo necesario, falta variedad en categorías específicas y se perciben alternativas más limitadas en ciertos momentos. Se sugiere reforzar el surtido en categorías sensibles y revisar quiebres recurrentes por tipo de producto, asegurando reposición oportuna y sustitutos visibles en sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 31,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a faltantes puntuales y estanterías con menor abastecimiento, incluyendo casos donde el cliente no encuentra productos específicos o percibe reposición lenta. Se sugiere levantar un control diario de quiebres por secciones críticas y horarios, con reposición priorizada en sala y comunicación simple de alternativas cuando no haya stock.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 41,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparece alguna mención a precios poco claros en góndola, diferencias entre lo exhibido y lo cobrado, y promociones que no se entienden bien. Se sugiere reforzar la ejecución de flejes y señalética de precio, y activar una revisión rápida en cajas para resolver diferencias sin fricción y evitar pérdida de tiempo del cliente.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 53,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a experiencias negativas con carnes y algunos frescos en mal estado, además de reclamos por devoluciones que consumen tiempo. Se sugiere reforzar controles de frescura por lote y vitrina, y asegurar un protocolo ágil de cambio/devolución en el momento para reducir fricción cuando ocurra un incidente.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 58,6 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aunque hay menciones positivas de buena disposición, también aparece alguna mención a malos tratos puntuales y a una atención poco cuidadosa en cajas y autoservicio. Se sugiere reforzar pautas de trato y contención en momentos de alta demanda, con supervisión visible en cajas y autoservicio para corregir conductas y apoyar al cliente en el momento.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 65,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Aparece alguna mención a carros en mal estado y difíciles de maniobrar, lo que afecta especialmente compras grandes. Se sugiere implementar una revisión diaria de carros con retiro inmediato de los defectuosos y un plan simple de mantención y limpieza para asegurar disponibilidad operativa.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 6,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a pocas cajas abiertas, filas largas y autoservicio colapsado o con necesidad constante de asistencia, generando pérdida de tiempo y frustración. Se sugiere ajustar dotación y apertura de cajas por franjas horarias de mayor flujo, y reforzar el soporte en autoservicio con un anfitrión dedicado para destrabar incidencias y acelerar el pago."}, {"id": "0056", "nombre": "0056 Gran Avenida", "kpiEvolutivo": [32.3, 32.5, 34.2, 22.2], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 22,2 pts</strong>, bajando -12,0 pts respecto a la semana previa y ubicándose en el lugar 93 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\nEn el acumulado de las últimas 4 semanas, <strong>se consolida un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -10,0 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. Esto deja al local en una posición por debajo de la mayoría de, reflejando una trayectoria que no logró compensar las contracciones intermedias y que exige contención operativa inmediata para frenar la caída.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 33,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece recurrentemente confusión por precios y promociones que no coinciden entre góndola y caja, además de menciones a señalética incompleta o “a medias”. Se sugiere reforzar la ejecución de precios y promociones con doble validación diaria góndola-caja y señalética simple y visible en puntos críticos.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 17,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a baja variedad en categorías específicas y a que “no hay” productos habituales, especialmente en compras rápidas donde el cliente espera resolver lo básico. Se sugiere definir un listado corto de “imprescindibles” por categoría y asegurar reposición prioritaria en horarios de mayor flujo, con revisión de quiebres al menos dos veces al día.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 25,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a filas largas, pocas cajas operativas y fricción en autoservicio que termina alargando la compra, especialmente en hora peak. Se sugiere ajustar dotación y apertura de cajas por tramos horarios, asignar apoyo fijo a autoservicio en picos y ordenar la fila preferencial para evitar desbordes y conflictos."}, {"id": "0057", "nombre": "0057 Vitacura", "kpiEvolutivo": [36.3, 38.5, 36.1, 36.2], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 36,2 pts</strong>, subiendo +0,1 pts respecto a la semana previa y ubicándose en el lugar 64 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn una mirada de las últimas 4 semanas, <strong>la gestión ha mostrado una trayectoria plana y lineal, consolidando un escenario de estancamiento o inmovilidad estructural en la experiencia del cliente</strong>, cerrando con una variación marginal de -0,1 pts frente a la primera semana analizada. Este movimiento menor se mantiene sin significancia estadística y no altera el balance operacional, manteniendo al local por debajo de la mayoría de los locales.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 31,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a precios mal informados o inexistentes en góndola, diferencias entre cartel y cobro en caja y poca claridad para identificar ofertas. Se sugiere reforzar la ejecución de sala con revisión diaria de cartelería por pasillo, validación de precios en sistema antes de apertura y un protocolo de corrección rápida cuando el cliente detecta diferencias.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 37,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a quiebres de stock recurrentes, productos en oferta que se terminan y faltantes que obligan a completar la compra en otro supermercado, además de fricciones en compra online por sustituciones y plazos acotados para aprobar cambios. Se sugiere atacar quiebres por categorías críticas con reposición en horarios de menor afluencia, revisión de top faltantes semanal y, en online, mejorar la comunicación de sustituciones con ventanas de respuesta más razonables y alternativas equivalentes predefinidas.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 43,0 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparece alguna mención a menor surtido versus competidores y a falta de formatos o alternativas específicas, por ejemplo gramajes, productos sin gluten o importados. Se sugiere levantar un listado corto de “productos buscados y no encontrados” desde sala y atención al cliente para ajustar surtido local en categorías sensibles y asegurar presencia de alternativas básicas por segmento.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 58,0 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones a pocas cajas abiertas en momentos de alta afluencia, demoras en autoservicio y tiempos perdidos por validación de precios o reinicios de sistema. Se sugiere ajustar dotación por franjas horarias, habilitar apoyo visible en autoservicio y reducir fricciones con un “runner” para validaciones de precio y contingencias de caja.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 59,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Algunos comentarios apuntan a experiencias puntuales con carnes, pollo, huevos y verduras en mal estado o con problemas de frescura, además de reclamos por cambios y devoluciones. Se sugiere reforzar controles de recepción y revisión en vitrina, asegurar rotación y retiro preventivo de productos dudosos, y facilitar una resolución simple en sala cuando el cliente reporta un perecible en mal estado.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 55,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones a buena amabilidad en general, pero también a episodios de mala disposición, falta de apoyo en dudas y fricciones en autoservicio o con guardias. Se sugiere reforzar presencia de supervisión en puntos de fricción, estandarizar el trato en situaciones de reclamo y asegurar que siempre haya un responsable visible para resolver rápidamente sin derivaciones innecesarias."}, {"id": "0058", "nombre": "0058 Viña Del Mar", "kpiEvolutivo": [56.2, 51.5, 48.1, 52.7], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 52,7 pts</strong>, subiendo +4,5 pts respecto a la semana previa y ubicándose en el lugar 13 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>A lo largo de las últimas 4 semanas la gestión ha mostrado una trayectoria plana y lineal, consolidando un escenario de estancamiento o inmovilidad estructural en la experiencia del cliente</strong>, donde el in  góndola y cobro en caja, además de falta de precios visibles en algunos productos, lo que genera fricción al momento de pagar. Se sugiere reforzar revisión diaria de señalética y precios en sala, y un protocolo rápido de corrección en caja cuando el cliente detecta inconsistencias."}, {"id": "0061", "nombre": "0061 Maipu", "kpiEvolutivo": [44.9, 28.8, 25.5, 7.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 7,3 pts</strong>, bajando -18,3 pts respecto a la semana previa y ubicándose en el lugar 104 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro sostenido y estable a la baja</strong>, cerrando con una contracción acumulada de -37,6 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. Esto deja al local en una posición por debajo de la mayoría de locales, reflejando una pérdida estructural de experiencia que requiere contención operativa inmediata para evitar que la caída se siga profundizando.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 17,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a falta de variedad y quiebres de stock, incluyendo productos específicos que no están disponibles y sustituciones no consultadas en compras online. Se sugiere reforzar reposición y revisión diaria de quiebres por categorías críticas, además de asegurar protocolo de sustitución con confirmación al cliente en pedidos.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 34,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a productos no frescos o en mal estado, como helados derretidos, lácteos vencidos y percepción de poca frescura en el área de frutas y verduras. Se sugiere intensificar controles de cadena de frío y fechas de vencimiento por turno, con retiro preventivo y reposición prioritaria en perecibles de alta rotación.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 23,4 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a filas largas, pocas cajas habilitadas y esperas extensas, incluyendo casos de caja preferencial que no opera como tal. Se sugiere ajustar dotación y apertura de cajas en franjas de alta afluencia, reforzar caja rápida para pocos productos y asegurar cumplimiento efectivo de la atención preferencial."}, {"id": "0062", "nombre": "0062 Pza.Vespucio", "kpiEvolutivo": [41.3, 41.7, 41.5, 41.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 41,3 pts</strong>, bajando -0,2 pts respecto a la semana previa y ubicándose en el lugar 45 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>A lo largo de las últimas 4 semanas la gestión ha mostrado una trayectoria plana y lineal, consolidando un escenario de estancamiento o inmovilidad estructural en la experiencia del cliente</strong>, donde el indicador cierra con una variación marginal de +0,0 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística y que no altera el balance operacional. En este contexto, el desempeño se mantiene por debajo de la mayoría de los locales, por lo que el desafío es convertir la estabilidad en una mejora concreta y sostenida en sala y cajas.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 51,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios aparece que, aunque varios clientes valoran la variedad, también se repiten menciones a productos específicos que no se encuentran y a una percepción de menor surtido que antes. Se sugiere reforzar revisión de quiebres por categorías sensibles y asegurar sustitutos visibles en góndola para reducir frustración de búsqueda.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 47,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones a faltantes por días en productos puntuales y a inconsistencias entre lo que el cliente espera encontrar y lo que efectivamente está disponible. Se sugiere implementar un control diario de top quiebres y reposición en horarios de alta afluencia, con responsables claros por sección.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 68,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aunque hay comentarios positivos sobre frescura, también aparecen menciones a carnes en mal estado, pan con hongos y perecibles que llegan malos en algunas ocasiones. Se sugiere reforzar chequeos de calidad por turno, rotación FEFO y revisión estricta de cadena de frío y mermas en carnicería y panadería.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 59,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios conviven menciones a “buenos precios y ofertas” con reclamos por “caro” y por diferencias entre precio en góndola y cobro en caja. Se sugiere auditar diariamente precios visibles versus sistema, priorizar señalética de ofertas y corregir rápidamente discrepancias para evitar malos ratos en caja y en Servicio al Cliente.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 64,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones positivas hacia cajeras, pero también aparecen casos de mala atención y trato poco amable, especialmente en cajas de autoservicio y en situaciones de ayuda. Se sugiere reforzar supervisión en autoservicio con foco en trato y resolución, y estandarizar un mínimo de saludo, apoyo y cierre en interacciones de caja.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 44,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a pocas cajas habilitadas, filas largas y lentitud en momentos de alta demanda, incluyendo autoservicio congestionado. Se sugiere ajustar dotación y apertura dinámica por franjas críticas, con un responsable de “gestión de filas” que active cajas y ordene flujos cuando sube la congestión.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 34,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a falta de carros de forma habitual, esperas largas y necesidad de ir a buscarlos al estacionamiento, lo que deteriora la comodidad desde el inicio de la visita. Se sugiere asegurar reposición continua con rondas programadas, puntos de acopio en accesos y un control visible de stock de carros en horas punta."}, {"id": "0066", "nombre": "0066 Talagante", "kpiEvolutivo": [56.9, 47.8, 46.1, 40.9], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 40,9 pts</strong>, bajando -5,2 pts respecto a la semana previa y ubicándose en el lugar 48 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -16,0 pts frente a la primera semana analizada. Esta trayectoria confirma una caída relevante que no logró ser compensada en los cortes intermedios, consolidando un escenario que exige contención operativa para evitar que el retroceso se siga profundizando.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 21,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a góndolas vacías, falta de reposición y productos sin stock, lo que termina acotando la compra y obligando a completar en la competencia. Se sugiere reforzar reposición en sala con foco en quiebres recurrentes, validar disponibilidad real vs. flejes y priorizar un “top faltantes” diario por sección.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 40,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a descuentos que no se respetan en caja, diferencias entre fleje y cobro, y falta de claridad en condiciones de ofertas o beneficios asociados. Se sugiere asegurar consistencia fleje-caja con chequeos por franja horaria, reforzar señalética simple de condiciones y habilitar un protocolo rápido de resolución en cajas y autoservicio.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 45,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a poca amabilidad, falta de apoyo en autoservicio y situaciones de trato poco cuidadoso en sala, además de fricción en caja ante consultas. Se sugiere reforzar presencia activa de apoyo en autoservicio, alinear estándares de trato en momentos de alta demanda y hacer seguimiento semanal de reclamos por atención con retroalimentación directa a los equipos."}, {"id": "0071", "nombre": "0071 Vespucio Sur", "kpiEvolutivo": [27.9, 38.2, 35.4, 41.9], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 41,9 pts</strong>, subiendo +6,4 pts respecto a la semana previa y ubicándose en el lugar 42 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>En las últimas 4 semanas, el local consolidó una trayectoria de mejora sólida en el mediano plazo</strong>, acumulando un avance neto y saludable de +14,0 pts desde la primera semana analizada. Este recorrido muestra una recuperación consistente, sin señales de retrocesos relevantes que hayan puesto en riesgo el repunte, y cierra con una mejora estadísticamente significativa que confirma el cambio de nivel en la experiencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 60,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen algunas menciones a precios que no coinciden con lo exhibido, precios ilegibles o falta de señalética, lo que termina generando confusión en sala y en caja. Se sugiere reforzar la ejecución de cartelería y validación diaria de precios en góndola, con chequeos puntuales en categorías de alta rotación y apoyo visible en pasillos.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 34,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a “poca variedad” y a que no está todo lo que el cliente busca, incluyendo faltantes específicos y una percepción de surtido limitado. Se sugiere levantar un listado corto de productos más reclamados por los clientes y asegurar su presencia con reposición prioritaria y sustitutos equivalentes visibles cuando haya quiebres.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 71,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. En comentarios aparece fricción por operación en sala que dificulta el desplazamiento, como pasillos obstruidos por mercadería y desorden, lo que amplifica la necesidad de contar con carros disponibles y operativos al ingreso. Se sugiere asegurar disponibilidad en horas punta con rondas de recuperación de carros y ordenar puntos críticos de pasillo para evitar bloqueos en el recorrido.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 67,6 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a mala calidad en verdulería y casos de productos en mal estado, especialmente en carnes y algunos preparados, lo que afecta la confianza al comprar. Se sugiere reforzar controles de frescura por turno, retiro preventivo de productos observados por clientes y revisión de exhibición y temperatura en vitrinas de carnes y pollos.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 18,4 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a estanterías vacías, góndolas sin reponer y mercadería en cajas apiladas en pasillos, además de pedidos incompletos en compras por aplicación. Se sugiere priorizar reposición en sala con foco en quiebres visibles, despejar pasillos de sobrestock y activar un control diario de top faltantes, incluyendo seguimiento específico a preparación de pedidos para reducir sustituciones y omisiones."}, {"id": "0072", "nombre": "0072 Alameda", "kpiEvolutivo": [46.8, 41.6, 38.5, 32.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 32,8 pts</strong>, bajando -5,6 pts respecto a la semana previa y ubicándose en el lugar 77 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>Se observa un deterioro estructural y sostenido en el mediano plazo</strong> durante las últimas 4 semanas, acumulando una contracción de -14,0 pts frente a la primera semana analizada. Este retroceso se mantiene como un quiebre estadísticamente significativo y confirma que la experiencia viene debilitándose de forma consistente, sin repuntes que logren compensar la caída.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 20,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios se repiten menciones a quiebres de stock y reposición lenta, con clientes que no encuentran productos específicos o que la app indica disponibles pero no están en sala. Se sugiere reforzar reposición y control de quiebres por categorías críticas, con revisión diaria de top faltantes y validación de consistencia sala versus app.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 30,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a poca variedad en categorías puntuales y tamaños específicos, además de faltantes recurrentes que terminan percibiéndose como menor surtido. Se sugiere ajustar el surtido de sala en categorías sensibles y asegurar planogramas y frentes completos, priorizando los productos más buscados por misión de compra.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 50,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a productos en mal estado o próximos a vencer y a una experiencia más débil en verduras y frutas en ciertas visitas. Se sugiere intensificar controles de frescura por turnos, retiro preventivo de merma visible y reposición más frecuente en horarios de mayor flujo, con foco en sala de frutas y verduras."}, {"id": "0073", "nombre": "0073 Puente Alto", "kpiEvolutivo": [50.0, 40.1, 42.4, 28.0], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 28,0 pts</strong>, bajando -14,4 pts respecto a la semana previa y ubicándose en el lugar 87 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\nEn el acumulado de las últimas 4 semanas, <strong>se observa un deterioro estructural y sostenido en la experiencia, con una caída estable que termina consolidando una pérdida relevante en el cierre</strong>, acumulando -22,0 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. Este patrón deja al local por debajo de la mayoría de unidades, reforzando la necesidad de estabilizar la operación y recuperar consistencia en los básicos de sala y servicio.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 10,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Se repiten menciones a quiebres de stock, góndolas vacías y falta de productos en promociones, además de reclamos por refrigeradores apagados o sin reposición en bebestibles. Se sugiere reforzar reposición diaria por categorías críticas y promociones, con revisión de quiebres por franja horaria y plan de recuperación rápido en sala.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 29,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios se repiten esperas largas, pocas cajas abiertas y congestión en horarios punta, incluyendo fricción en autoservicio y episodios por caídas intermitentes de medios de pago. Se sugiere ajustar dotación y apertura efectiva de cajas por demanda, con un responsable de piso para activar refuerzos y destrabar autoservicio y pagos cuando se generen filas.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 34,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Aparecen menciones a precios poco claros, diferencias entre góndola y caja, y promociones confusas o sin stock asociado, lo que genera desconfianza en la compra. Se sugiere implementar una rutina diaria de verificación de precios y señalética en pasillos de alta rotación, con corrección rápida de inconsistencias detectadas en caja y en góndola."}, {"id": "0074", "nombre": "0074 Tomas Moro", "kpiEvolutivo": [32.9, 36.3, 32.7, 24.6], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 24,6 pts</strong>, bajando -8,1 pts respecto a la semana previa y ubicándose en el lugar 90 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se consolida un deterioro estructural y sostenido en la experiencia, con un comportamiento estable a la baja</strong>, acumulando una contracción de -8,3 pts frente a la primera semana analizada, en un movimiento que además es estadísticamente significativo. Esto deja al local operando con menos margen para absorber fricciones del día a día, y exige foco en ejecución para frenar la caída y recuperar consistencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 7,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a falta de surtido y ausencia de productos específicos, incluyendo categorías puntuales como sin gluten, bebidas retornables y algunos importados. Se sugiere reforzar revisión de surtido por quiebres recurrentes y ajustar reposición por categorías críticas, con seguimiento diario de faltantes más mencionados.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 19,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios se repiten referencias a góndolas vacías, bajo stock y falta de alternativas cuando no está el producto buscado. Se sugiere implementar control de quiebres en sala por franjas horarias y asegurar reposición o sustitución visible en góndola para reducir la sensación de “no hay”.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 35,3 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a problemas en carnes y frescos, incluyendo reclamos por productos en mal estado y falta de precio en frutas y carnes, lo que aumenta fricción en la compra. Se sugiere reforzar control de calidad en recepción y sala, y asegurar rotulación de precios en perecibles con responsables por turno.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios aparece frustración por ofertas poco atractivas, ofertas sin stock y diferencias entre precio en góndola y cobro en caja. Se sugiere auditar diariamente coherencia góndola-caja en promociones activas y asegurar señalética simple y vigente en pasillos y exhibiciones.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 51,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aunque hay menciones positivas a cajeros amables, también se repiten casos de mala actitud en caja y atención al cliente, con situaciones donde el cliente siente poca empatía o falta de apoyo ante problemas. Se sugiere reforzar pautas de trato y escalamiento en caja y mesón, con supervisión visible en horas punta y retroalimentación rápida ante incidentes.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 45,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios se observa fricción por pocas cajas habilitadas en algunos momentos y demoras en autoservicio por falta de apoyo, además de episodios de cierre de cajas sin aviso. Se sugiere ajustar dotación por demanda y asegurar apoyo dedicado en autoservicio, con criterio claro para apertura oportuna de cajas y comunicación al cliente cuando se cierre una línea."}, {"id": "0075", "nombre": "0075 Maipu", "kpiEvolutivo": [58.3, 48.1, 47.6, 45.7], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 45,7 pts</strong>, bajando -2,0 pts respecto a la semana previa y ubicándose en el lugar 33 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -12,7 pts frente a la primera semana analizada, con un movimiento que además resulta significativo. Esto sugiere que la operación no ha logrado compensar las contracciones de las semanas intermedias, dejando al indicador en una trayectoria que exige correcciones consistentes para frenar la caída, aun cuando hoy el local se mantiene por sobre la mayoría de los locales en el ranking.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 23,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Se repiten menciones a quiebres de stock y estanterías vacías, además de casos de búsqueda de productos específicos que no se encuentran o se reemplazan por alternativas. Se sugiere reforzar reposición y control de quiebres por categorías críticas, con revisión diaria de góndola y alertas tempranas para productos de alta rotación.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 47,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece comparación con otros locales donde “se encuentra de todo”, además de menciones a poca variedad en ciertas categorías y tallas, y a la falta de productos específicos. Se sugiere ajustar surtido por demanda local y estacionalidad, levantando un listado corto de “productos más buscados y no encontrados” para gestionarlo semanalmente con sala y abastecimiento.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 61,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones a alzas de precios y a diferencias entre precio en góndola versus caja, incluyendo reclamos por descuentos que no se aplican o precios cambiados. Se sugiere reforzar la ejecución de precios y promociones con doble validación diaria de cartelería y toma-precios, y un protocolo simple de resolución en caja para evitar fricción y reclamos.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 73,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparece alguna mención a fricciones en el uso y devolución de carros, incluyendo interacciones incómodas con personal asociado a carros en el exterior. Se sugiere ordenar el circuito de carros con supervisión en horas punta y reforzar pautas de trato y apoyo al cliente, especialmente en estacionamientos y accesos."}, {"id": "0076", "nombre": "0076 Departamental", "kpiEvolutivo": [57.8, 33.9, 30.6, 30.0], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 30,0 pts</strong>, bajando -0,6 pts respecto a la semana previa y ubicándose en el lugar 82 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong e las ofertas y promociones</strong> registró una satisfacción neta de 39,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a confusión de precios, etiquetas poco claras y diferencias entre góndola y caja que terminan derivando en fricción en atención al cliente. Se sugiere ejecutar una rutina diaria de verificación de precios y señalética en pasillos críticos, asegurando consistencia entre oferta publicada, etiqueta y cobro en caja."}, {"id": "0077", "nombre": "0077 Independencia", "kpiEvolutivo": [30.0, 40.5, 45.1, 29.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 29,5 pts</strong>, bajando -15,6 pts respecto a la semana previa y ubicándose en el lugar 83 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\nEn las últimas 4 semanas, <strong>el NPS se mantuvo sin un cambio relevante en el balance final, pero con un comportamiento volátil</strong>, cerrando con una variación neta de -0,5 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística. En la práctica, esto sugiere una experiencia con altibajos que no logra consolidar mejoras sostenidas y que puede amplificar el impacto de semanas negativas como la actual. Dado que el local está por debajo de la mayoría de unidades, el foco debe estar en estabilizar la operación para evitar nuevos quiebres en el corto plazo.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 28,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a filas extensas, cajas cerradas y esperas muy largas, incluyendo casos de 45 minutos o más y dificultades en cajas preferenciales. Se sugiere reforzar dotación y apertura de cajas en horas punta, con un responsable de piso que gestione flujo, priorice preferenciales y habilite apoyos rápidos cuando se acumulen filas.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 71,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. En comentarios aparece fricción asociada al orden y a la experiencia de entrada y salida en momentos de alta demanda, lo que suele tensionar la disponibilidad y rotación de implementos de compra. Se sugiere implementar rondas de recuperación de carros por tramo horario y asegurar un punto de acopio visible y abastecido en accesos, especialmente en fines de semana y tardes.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 65,6 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aunque hay varias menciones positivas a atención cordial y rápida, también aparecen casos de mala disposición y trato inadecuado en secciones específicas y servicio al cliente, incluyendo respuestas poco empáticas. Se sugiere reforzar supervisión en sala y servicio al cliente, con pautas simples de trato y escalamiento, y seguimiento semanal de incidentes por sección para corregir conductas y asegurar consistencia."}, {"id": "0078", "nombre": "0078 Iquique", "kpiEvolutivo": [36.9, 39.7, 37.5, 47.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 47,4 pts</strong>, subiendo +9,9 pts respecto a la semana previa y ubicándose en el lugar 29 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se observa una trayectoria de mejora sólida en el mediano plazo</strong>. El local consolidó un avance neto y saludable de +10,5 pts desde la primera semana analizada, con un quiebre estadísticamente significativo que refuerza que la recuperación es consistente y no responde solo a variaciones puntuales.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 32,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. En comentarios se repiten menciones a quiebres de stock, reposición lenta y desalineación entre lo ofrecido en la app y lo disponible en sala. Se sugiere reforzar reposición en sala con revisión diaria de top quiebres y ajustar la actualización de stock en app para reducir sustituciones y frustración en la compra.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 65,6 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Aparecen menciones a productos no frescos y casos puntuales de perecibles en mal estado o vencidos, especialmente en carnes y algunos envasados. Se sugiere intensificar controles de frescura y fechas en vitrinas y góndolas en horarios críticos, con retiro preventivo y reposición más frecuente.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 59,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aunque hay varios comentarios positivos por amabilidad y rapidez, también aparecen menciones a trato poco amable o falta de apoyo al consultar por productos y precios. Se sugiere reforzar presencia de jefatura en piso y un estándar simple de atención en consultas, priorizando acompañamiento efectivo y cierre cordial.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a filas largas, pocas cajas habilitadas y fricción en autoservicio y cajas rápidas cuando no se respeta el límite de productos. Se sugiere ajustar dotación y apertura dinámica en horas punta, y ordenar el flujo de cajas rápidas con control visible del límite y apoyo activo en autoservicio para destrabar incidencias."}, {"id": "0079", "nombre": "0079 Talca", "kpiEvolutivo": [53.7, 52.9, 51.5, 56.1], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 56,1 pts</strong>, subiendo +4,6 pts respecto a la semana previa y ubicándose en el lugar 10 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\nEn una mirada de las últimas 4 semanas, <strong>la gestión muestra una trayectoria plana y lineal, consolidando un escenario de estancamiento estructural en la experiencia del cliente</strong>, cerrando con una variación marginal de +2,4 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística y que no altera el balance operacional.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 56,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios se repiten menciones a alzas de precios y a diferencias entre el precio en góndola y el cobrado en caja, lo que erosiona la percepción de conveniencia incluso cuando hay ofertas. Se sugiere reforzar el control de etiquetado y coherencia góndola-caja con revisiones diarias por pasillo y un protocolo de corrección rápida cuando se detecten desajustes.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 46,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a quiebres y falta de reposición en góndolas, además de casos donde el sistema muestra productos disponibles y luego se cancelan compras o demoran devoluciones. Se sugiere asegurar reposición en horarios críticos, levantar un listado de quiebres recurrentes por categoría y alinear sala con canales digitales para evitar promesas de stock que no se cumplen.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 62,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a carne y aves en mal estado u olor, junto con observaciones puntuales de frutas en descomposición, aunque también se reconoce frescura en verduras en otras visitas. Se sugiere reforzar controles de calidad por lote y vitrina, con retiro preventivo ante alertas, y asegurar rotación y cadena de frío especialmente en carnes y aves."}, {"id": "0080", "nombre": "0080 Los Morros", "kpiEvolutivo": [50.0, 39.9, 39.8, 22.2], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 22,2 pts</strong>, bajando -17,5 pts respecto a la semana previa y ubicándose en el lugar 93 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -27,8 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. La trayectoria refleja contracciones que no lograron ser compensadas, dejando al indicador en un nivel que exige correcciones operativas consistentes para frenar la caída.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 16,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a falta de stock, es o y cobrado, y promociones poco claras o desordenadas en sala. Se sugiere implementar un control diario de flejes y cartelería en pasillos críticos, más validación en caja de promociones activas para evitar inconsistencias."}, {"id": "0081", "nombre": "0081 Arica", "kpiEvolutivo": [55.2, 53.1, 55.3, 69.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 69,4 pts</strong>, subiendo +14,1 pts respecto a la semana previa y ubicándose en el lugar 1 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,9 pts en la última semana.\n\n<strong>En las últimas 4 semanas, el local consolidó una trayectoria de mejora sólida y sostenida</strong>, acumulando un avance neto de +14,2 pts frente a la primera semana analizada, con un movimiento que además se sostiene con significancia estadística. Esto deja una base favorable para estabilizar el desempeño en un nivel alto, cuidando que los puntos operativos no vuelvan a abrir brechas en sala y en la compra completa.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 36,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a falta de stock, góndolas vacías y reposición insuficiente, lo que termina afectando la compra completa. Se sugiere reforzar quiebres por categorías críticas con reposición en sala en franjas de alta demanda y un control diario de top faltantes.\n\n<strong>La va
