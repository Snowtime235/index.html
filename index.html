cierre convive con frentes operativos que aún no se sostienen de forma consistente.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 18,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a faltantes en góndola, reposición tardía y quiebres de stock en categorías específicas, además de reclamos por ofertas no repuestas. Se sugiere reforzar reposición en sala con foco en horarios de mañana y alta afluencia, asegurando ejecución de ofertas y revisión diaria de quiebres por sección.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 36,4 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen comentarios que contrastan una percepción de “harta variedad” con menciones a poca variedad en algunas líneas y ausencia de productos vistos online o en otros locales. Se sugiere levantar un listado corto de productos recurrentemente solicitados y no encontrados, y ajustar surtido y exhibición por categorías sensibles para este local.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 43,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a precios convenientes y ofertas, pero también aparecen fricciones por diferencias de precio en caja versus góndola y productos sin precio visible. Se sugiere reforzar control de flejes y coherencia góndola-caja, con revisión por pasillo en horarios de apertura y un punto de resolución rápida cuando el cliente detecte discrepancias.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 43,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a pocas cajas abiertas, filas muy largas y falta de respeto de la caja preferencial, aunque también aparecen semanas donde se perciben más cajas operativas y atención expedita. Se sugiere ajustar dotación y apertura dinámica de cajas por franjas de demanda, asegurar funcionamiento real de preferencial y reforzar apoyo activo en autoservicio para evitar cuellos de botella."}, {"id": "0083", "nombre": "0083 La Florida", "kpiEvolutivo": [41.4, 31.4, 31.5, 33.6], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 33,6 pts</strong>, subiendo +2,1 pts respecto a la semana previa y ubicándose en el lugar 74 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\nEn una mirada de las últimas 4 semanas, <strong>se observa un deterioro estructural y sostenido en la experiencia, cerrando con una pérdida acumulada de -7,8 pts que además es estadísticamente significativa</strong>. Esto sugiere que, más allá del repunte reciente, la operación viene arrastrando contracciones que no han logrado compensarse y que hoy dejan al indicador en un nivel exigente para la gestión del día a día.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 23,7 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Se repiten menciones a góndolas vacías, falta de reposición y productos que aparecen como disponibles pero no están, incluyendo quiebres en ofertas y pedidos que se terminan cancelando por falta de stock. Se sugiere reforzar reposición en sala y control de quiebres por categorías críticas, con revisión diaria de top faltantes y validación de disponibilidad real para evitar promesas que no se cumplen.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 25,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. En comentarios aparece espera prolongada, pocas cajas habilitadas y demoras por autorizaciones de supervisión o problemas en autoservicio que traban la fila. Se sugiere ajustar dotación y apertura de cajas por franjas de alta afluencia, y asegurar presencia activa de supervisión y apoyo en autoservicio para destrabar incidencias en minutos, no en filas.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 30,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Se repiten menciones a precios faltantes en góndola, cartelería confusa o desactualizada y diferencias entre precio exhibido y cobro en caja, lo que genera fricción al momento de pagar. Se sugiere implementar un chequeo diario de señalética y precios en categorías sensibles, más un protocolo rápido de resolución en caja para respetar precio exhibido y evitar que el cliente tenga que volver a sala.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 27,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Aparecen menciones a menor surtido y eliminación de venta a granel en carnes y pollo, además de faltas de marcas o categorías específicas, lo que refuerza la percepción de que ya no se “encuentra todo”. Se sugiere revisar surtido mínimo por misión de compra y recuperar alternativas clave donde el cliente percibe pérdida, priorizando categorías de alta recurrencia y sustitutos visibles cuando falte el producto habitual.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 44,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. En comentarios se repiten percepciones de precios altos versus competencia y frustración cuando las promociones no aplican como se esperaba o no hay reposición del producto en oferta. Se sugiere asegurar ejecución de precios y promociones en sala, con foco en productos comparables y en disponibilidad de los ítems en oferta para que el cliente efectivamente perciba el beneficio al comprar.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 57,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a problemas en carnes y olores, incluyendo experiencias negativas asociadas a frescura y manejo en el sector, lo que eleva el riesgo reputacional del local. Se sugiere reforzar controles de cadena de frío, rotación y revisión de exhibición en perecibles, con retiro preventivo ante dudas y supervisión visible en horarios de mayor venta.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 49,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. En comentarios aparece falta de apoyo en sala y autoservicio, mala disposición en algunos casos y necesidad de mayor orientación tras cambios de layout. Se sugiere reforzar presencia en piso con roles claros de apoyo y una pauta simple de trato y resolución, especialmente en cajas, autoservicio y puntos donde el cliente requiere guía.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 49,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Se repiten menciones a corrales vacíos y dificultad para encontrar carros en momentos de alta afluencia, lo que deteriora el inicio de la visita. Se sugiere asegurar rondas de recolección y reposición de carros con responsable por turno, y ordenar puntos de acopio para evitar quiebres en horas punta."}, {"id": "0084", "nombre": "0084 El Belloto", "kpiEvolutivo": [36.1, 44.2, 46.6, 39.1], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 39,1 pts</strong>, bajando -7,6 pts respecto a la semana previa y ubicándose en el lugar 57 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn las últimas 4 semanas, <strong>aunque el balance final muestra una variación neta menor de +3,0 pts que se mantiene sin significancia estadística, la operación interna estuvo sujeta a inestabilidad.</strong> Esto sugiere una experiencia que no logra sostener consistencia semana a semana, con avances puntuales que luego se diluyen. El foco de gestión debiera estar en estabilizar la ejecución diaria para evitar nuevos quiebres como el de esta semana.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 27,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado y presentar una baja respecto a la semana anterior. Se repiten menciones a precios que no coinciden en caja, descuentos que no se aplican y confusión con condiciones de ofertas, por ejemplo cuando no se ingresa el RUT o por etiquetado incompleto. Se sugiere reforzar el control diario de flejes y cartelería, más un “doble chequeo” en cajas para validar aplicación de promociones antes del cobro.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 34,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece falta de stock y góndolas vacías, además de sustituciones o quiebres en compras online y pick up que terminan en pedidos incompletos. Se sugiere implementar revisión por secciones críticas en horarios punta y un protocolo de reposición rápida para top faltantes, alineando sala con preparación de pedidos para reducir sustituciones.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 40,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas habilitadas, filas extensas en hora peak y fricción en autoservicio por fallas o baja asistencia, lo que alarga el cierre de compra. Se sugiere ajustar la dotación y apertura de cajas por tramos horarios, con apoyo activo en autoservicio para destrabar incidencias y acelerar el flujo en momentos de alta demanda."}, {"id": "0085", "nombre": "0085 Oeste", "kpiEvolutivo": [51.0, 51.6, 47.7, 39.6], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 39,6 pts</strong>, bajando -8,0 pts respecto a la semana previa y ubicándose en el lugar 53 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro sostenido y estable a la baja</strong>, cerrando con una pérdida acumulada de -11,4 pts frente a la primera semana analizada, un retroceso estadísticamente significativo que no logró ser compensado en los cortes intermedios y que deja a la gestión con presión operativa para recuperar consistencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. En comentarios aparece fricción por diferencias entre el precio en góndola y lo cobrado, además de menciones a “ofertas no claras” o poco consistentes. Se sugiere reforzar control diario de flejes y cartelería, y un protocolo de resolución en caja y mesón cuando el precio no coincide, con corrección visible en sala.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 41,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a poca variedad en categorías específicas y a que marcas propias desplazan alternativas, además de reclamos puntuales por secciones con oferta limitada. Se sugiere levantar un listado corto de categorías “sensibles” por reclamo recurrente y ajustar surtido y exhibición con reposición focalizada en esas familias.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 41,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. En comentarios se repiten quiebres de stock y falta de reposición en productos habituales, incluyendo menciones a góndolas vacías y faltantes recurrentes. Se sugiere implementar revisión por tramos horarios de quiebres en sala y un plan de reposición prioritaria para los top faltantes reportados por clientes.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 56,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen algunas menciones a que ciertos productos se perciben “caros” o que los precios ya no se sienten tan convenientes frente a otras cadenas, pese a que también se valora lo económico en general. Se sugiere asegurar señalización clara de productos “precio líder” y revisar consistencia de precios en categorías más comentadas, para evitar que casos puntuales contaminen la percepción global.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 70,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios aparecen episodios de pocas cajas habilitadas, filas y fricción en autoservicio por autorizaciones frecuentes o fallas, además de casos puntuales de medios de pago con problemas. Se sugiere ajustar dotación por punta, reforzar soporte visible en autoservicio y asegurar un “plan de contingencia” simple para caídas de sistema y resolución rápida de pagos especiales como tarjetas de regalo."}, {"id": "0086", "nombre": "0086 Recoleta", "kpiEvolutivo": [52.4, 28.6, 27.2, 0.0], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 0,0 pts</strong>, bajando -27,2 pts respecto a la semana previa y ubicándose en el lugar 105 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,5 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se observa un deterioro estructural y sostenido, con un comportamiento estable a la baja</strong>, acumulando una pérdida de -52,4 pts desde la primera semana analizada. Este retroceso se mantiene como un quiebre estadísticamente significativo, confirmando que la caída no es puntual y que la experiencia se viene debilitando de forma consistente.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 22,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas habilitadas, filas largas, lentitud de cajeras y fricción en cajas de autoservicio por fallas y falta de apoyo oportuno. Se sugiere reforzar dotación y supervisión en horas punta, asegurar asistencia activa en autoservicio y levantar un plan corto de continuidad operativa para evitar cajas cerradas o con fallas.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 27,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. En comentarios aparece reiteradamente que faltan productos de la lista, quiebres de stock y góndolas vacías, incluyendo menciones a reposición insuficiente en categorías específicas. Se sugiere intensificar reposición en sala con foco en top faltantes, revisar cumplimiento de planograma y ejecutar recorridos diarios de quiebres con responsables por sección.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 27,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Algunos comentarios apuntan a diferencias entre precios publicados y lo cobrado, ofertas que no se respetan y falta de promociones visibles. Se sugiere reforzar control de flejes y precios en caja, validar activaciones antes de abrir sala y habilitar un punto de resolución rápida para reclamos de precio sin frenar el flujo de pago.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 47,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a malos tratos o poca empatía en cajas y, con fuerza, a experiencias tensas con guardias y controles de boleta, además de casos puntuales de interceptaciones por alarmas o boletas. Se sugiere alinear un estándar de trato en caja y seguridad, con pautas claras de abordaje respetuoso, escalamiento a jefatura ante conflictos y refuerzo de presencia de apoyo en zona de salida para evitar fricciones innecesarias."}, {"id": "0087", "nombre": "0087 Santa Rosa", "kpiEvolutivo": [46.0, 40.3, 39.2, 36.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 36,8 pts</strong>, bajando -2,4 pts respecto a la semana previa y ubicándose en el lugar 62 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>Se observa un deterioro estructural y sostenido en el desempeño del local a lo largo de las últimas 4 semanas</strong>, cerrando con una pérdida acumulada de -9,2 pts frente a la primera semana analizada, con un quiebre estadísticamente significativo que confirma un debilitamiento real en la experiencia y que no logró ser compensado con repuntes relevantes en los cortes intermedios.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 60,7 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios se valora que hay buenos precios y ofertas, pero también aparece alguna mención a alzas recientes y a que ciertos productos se perciben “altos”. Se sugiere reforzar señalización de precios en sala y activar chequeos diarios de coherencia precio góndola-caja en categorías sensibles.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 53,6 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a precios que no coinciden entre góndola y caja, promociones poco entendibles y falta de precios visibles en productos. Se sugiere implementar una rutina de validación por pasillo de flejes y cartelería, con responsable por zona y corrección inmediata ante diferencias.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 46,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Algunos comentarios apuntan a falta de variedad y a no encontrar productos específicos en la visita. Se sugiere levantar un listado semanal de “top faltantes” por categoría y ajustar surtido y reposición en base a quiebres recurrentes.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 39,3 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a falta de stock y productos sin reponer, incluyendo casos puntuales como helados, bebidas retornables y otros básicos. Se sugiere reforzar reposición en horas punta y asegurar un barrido de quiebres por secciones con foco en básicos de alta rotación.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Conviven menciones positivas de amabilidad con reclamos por trato inadecuado en caja y en apoyo de autoservicio, además de percepción de poco personal disponible. Se sugiere reforzar supervisión en línea de cajas y autoservicio en horarios críticos, con pautas simples de trato y apoyo activo al cliente.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 25,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a filas largas, pocas cajas abiertas y colapso de autoservicio, incluyendo esperas prolongadas. Se sugiere ajustar dotación y apertura dinámica de cajas según flujo, habilitar apoyo dedicado en autoservicio y monitorear tiempos de espera por franja para gatillar refuerzos oportunos.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a falta de carros al ingreso y a ausencia de personal que los recupere desde estacionamientos, lo que termina dificultando la compra, especialmente en momentos de alta afluencia. Se sugiere establecer rondas fijas de recuperación de carros con responsable por turno y un punto de control visible para asegurar disponibilidad continua."}, {"id": "0089", "nombre": "0089 emana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a quiebres de stock y góndolas sin reposición, incluyendo productos específicos que el cliente fue a buscar y no encontró. Se sugiere asegurar reposición por franjas horarias críticas, con revisión de top faltantes y recuperación rápida de sala antes de los horarios de mayor flujo.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 47,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen varias menciones a ofertas no respetadas, cartelería confusa o descuentos que no se aplican en caja, generando esperas para validación. Se sugiere implementar un “chequeo de ofertas” al inicio del día y en cambios de turno, más un responsable visible para validación inmediata en caja cuando exista discrepancia."}, {"id": "0091", "nombre": "0091 Antofagasta", "kpiEvolutivo": [32.3, 47.3, 44.3, 29.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 29,4 pts</strong>, bajando -14,9 pts respecto a la semana previa y ubicándose en el lugar 84 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>A lo largo de las últimas 4 semanas, aunque el balance final muestra una variación neta menor de -2,9 pts que no marca un cambio estadísticamente significativo, la operación interna estuvo sujeta a inestabilidad.</strong> En la práctica, esto deja al NPS moviéndose con altibajos que dificultan sostener una experiencia consistente, y mantiene al local por debajo de la mayoría de los locales en el ugiere reforzar señalética de precios y promociones en sala, asegurar consistencia entre góndola y caja y activar revisión diaria de diferencias de precio en categorías sensibles.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 34,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a filas largas, pocas cajas habilitadas y demoras por validaciones o incidencias de códigos que ralentizan el flujo. Se sugiere ajustar dotación y apertura de cajas por franjas de alta demanda, reforzar apoyo en autoservicio y habilitar un protocolo rápido para resolución de productos sin código o diferencias de precio sin frenar la fila.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a falta de publicidad de ofertas, confusión entre precio de góndola y cobro final, y reclamos por promociones no respetadas. Se sugiere ordenar la comunicación en sala con cartelería simple y vigente, auditar diariamente flejes y precios promocionales, y asegurar que jefaturas de turno resuelvan en el momento cualquier discrepancia para evitar fricción al cierre de compra."}, {"id": "0093", "nombre": "0093 Osorno", "kpiEvolutivo": [44.4, 56.9, 53.7, 48.6], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 48,6 pts</strong>, bajando -5,0 pts respecto a la semana previa y ubicándose en el lugar 25 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un de encial claramente operativa. Se sugiere ajustar dotación y apertura de cajas por franjas horarias, ordenar el flujo de cajas express y asegurar señalización y cumplimiento efectivo de atención preferencial."}, {"id": "0125", "nombre": "0125 Ovalle", "kpiEvolutivo": [37.8, 49.2, 46.4, 45.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 45,5 pts</strong>, bajando -1,0 pts respecto a la semana previa y ubicándose en el lugar 35 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas, el local muestra una trayectoria de mejora sostenida y consistente en el tiempo.</strong> En concreto, consolidó un avance neto de +7,7 pts desde la primera semana analizada, con un quiebre significativo que valida una mejora real en el mediano plazo y que hoy deja al indicador en línea con el resto de los locales.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 44,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a precios altos y, especialmente, a diferencias entre el precio exhibido y el cobrado en caja u ofertas que no se respetan. Se sugiere reforzar controles diarios de precios y ofertas en sala y caja, con resolución en el momento y escalamiento rápido cuando haya discrepancias.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 41,7 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a falta de carros y a clientes que deben ir a buscarlos al estacionamiento, elevando la fricción de la compra. Se sugiere asegurar reposición continua en puntos críticos, definir responsable por turno y habilitar un circuito corto de recuperación desde estacionamiento en horas punta.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 33,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta una baja respecto a la semana anterior. Se repiten menciones a quiebres y góndolas con faltantes, incluyendo productos específicos y categorías donde el cliente “no encontró lo que buscaba”. Se sugiere levantar un listado semanal de quiebres recurrentes por categoría, ajustar reposición en sala y mejorar señalización o sustitutos sugeridos cuando no haya stock.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 52,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a faltantes en carnes y a panadería con productos cercanos a vencimiento, junto con observaciones puntuales de calidad en algunos perecibles. Se sugiere reforzar rotación y control de fechas por franja horaria, y asegurar estándares visibles de reposición y presentación en panadería y carnes.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 44,4 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a falta de variedad, incluyendo solicitudes de más productos premium y casos donde no se encontró un producto específico. Se sugiere revisar surtido de categorías con más menciones, asegurar planogramas completos y activar reposición focalizada en los “top faltantes” reportados por clientes."}, {"id": "0127", "nombre": "0127 Linares", "kpiEvolutivo": [54.5, 45.3, 44.5, 26.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 26,4 pts</strong>, bajando -18,1 pts respecto a la semana previa y ubicándose en el lugar 88 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia, con una caída acumulada de -28,1 pts</strong>, reflejando contracciones que no lograron ser compensadas y que terminaron consolidando un cierre más débil para la gestión del local.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 27,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a precios “muy elevados” o “más altos” y a que las ofertas no siempre compensan esa percepción. Se sugiere reforzar señalización de precios y comparativos en sala, asegurar consistencia entre precio en góndola y caja, y activar comunicación simple de ofertas realmente convenientes en categorías sensibles.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a productos sin precio, ofertas que no estaban disponibles y casos de diferencias entre precios exhibidos y lo cobrado. Se sugiere ordenar la ejecución de cartelería y precios en góndola, asegurar reposición de packs promocionales y reforzar control diario de “precio visible y correcto” en pasillos de alta rotación.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 47,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas habilitadas, filas largas y necesidad de mayor apoyo en horas punta, incluyendo autoservicio. Se sugiere ajustar dotación y apertura de cajas por franja horaria, asignar apoyo activo en autoservicio y gestionar un plan de contingencia para picos de afluencia con supervisión en línea.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 61,4 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aunque hay varios comentarios positivos sobre amabilidad y apoyo en cajas, también aparece alguna mención a mala disposición, falta de respuesta al consultar en sala y experiencias puntuales de trato inadecuado. Se sugiere reforzar presencia en sala para consultas, estandarizar saludos y resolución en primera interacción, y hacer seguimiento cercano a reclamos de atención para corregir quiebres específicos."}, {"id": "0137", "nombre": "0137 San Pablo", "kpiEvolutivo": [45.5, 14.7, 10.4, -15.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de -15,5 pts</strong>, bajando -25,8 pts respecto a la semana previa y ubicándose en el lugar 106 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,5 pts en la última semana.\n\nEn las últimas 4 semanas, <strong>se observa un deterioro estructural y sostenido del NPS, con una trayectoria estable a la baja</strong>, acumulando una contracción de -60,9 pts frente a la primera semana analizada, lo que confirma un retroceso significativo en el mediano plazo y deja a la unidad en una posición por debajo de la mayoría de locales.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de -6,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a falta de stock, góndolas vacías y reposición insuficiente, incluso en productos específicos y de alta búsqueda. Se sugiere reforzar reposición diaria por quiebres críticos, asegurar sustitutos visibles y habilitar un protocolo simple de alternativa o solución cuando el producto no está disponible.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 13,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a carnes en mal estado y dudas sobre la temperatura de refrigeración, lo que deteriora la confianza en la compra de perecibles. Se sugiere intensificar controles de temperatura y rotación, reforzar revisión en carnicería y exhibiciones, y asegurar una respuesta ágil de cambio/devolución en sala para cortar el mal rato del cliente.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 13,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a demoras relevantes en cajas y autoservicio, con casos de incidencias operativas como gift cards y balanzas descalibradas que alargan la espera. Se sugiere ajustar dotación y apertura de cajas en horas punta, asignar apoyo fijo a autoservicio para destrabar errores en el momento y reforzar entrenamiento rápido en medios de pago y resolución de incidencias."}, {"id": "0140", "nombre": "0140 Las Rejas", "kpiEvolutivo": [44.9, 50.2, 47.5, 46.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 46,5 pts</strong>, bajando -1,0 pts respecto a la semana previa y ubicándose en el lugar 30 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa una trayectoria de mejora moderada y sostenida en el balance general</strong>, cerrando con una variación neta de +1,6 pts frente a la primera semana analizada, un movimiento que se mantiene sin significancia estadística. En la práctica, esto sugiere que el local ha logrado sostener el indicador sin grandes quiebres, pero todavía con espacio para consolidar una experiencia más consistente en el día a día.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 13,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a demoras, pocas cajas disponibles para la cantidad de clientes, falta de cajeros y esperas prolongadas por apoyo o supervisión en caja. Se sugiere reforzar dotación y supervisión en horas punta, asegurar apoyo inmediato ante incidencias y ordenar una pauta de apertura de cajas que evite acumulación de filas.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 21,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a quiebres de stock, reposición insuficiente y productos que se ofrecen o exhiben sin existencia, además de casos puntuales de vencidos o en mal estado. Se sugiere intensificar reposición por franjas horarias, revisar exhibiciones versus stock real y activar un control diario de fechas y condición en categorías sensibles.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 27,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a poca variedad y pocas marcas en categorías específicas, además de faltantes de productos puntuales que el cliente espera encontrar en el local. Se sugiere ajustar surtido mínimo por categorías de alta demanda y asegurar cobertura de marcas clave, con revisión semanal de los principales “no encontré” reportados en sala.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 48,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a precios mal puestos, letreros poco claros y diferencias entre lo exhibido en góndola y lo cobrado, especialmente en ofertas. Se sugiere reforzar el control de etiquetado y cartelería por turno, con doble validación de precios en promociones activas y resolución rápida en caja para evitar fricción al momento de pagar.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 45,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aunque aparecen varias menciones positivas sobre amabilidad, también se observan casos de mala atención en cajas y servicio al cliente, además de situaciones donde faltó explicación o disculpas ante problemas operativos. Se sugiere alinear un estándar simple de trato en caja y postventa, reforzar presencia de jefatura en línea de cajas y retroalimentar casos concretos para corregir conductas de forma inmediata.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 56,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparece alguna mención a carnes con mal olor, pollo no tan fresco y problemas de conservación o rotulación en vitrinas, lo que genera desconfianza al comprar. Se sugiere reforzar controles de temperatura y rotación, revisar presentación y etiquetado en perecibles y ejecutar una inspección diaria de calidad con retiro preventivo ante cualquier desviación.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 59,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a pocos carros disponibles en momentos de alta afluencia y necesidad de alternativas para clientes con movilidad reducida. Se sugiere asegurar un circuito de recuperación y orden de carros durante el día, con reposición activa en accesos y priorización de carros especiales en horarios de mayor demanda."}, {"id": "0165", "nombre": "0165 Ñuñoa (Plaza Egaña)", "kpiEvolutivo": [62.2, 34.4, 32.8, 14.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 14,3 pts</strong>, bajando -18,6 pts respecto a la semana previa y ubicándose en el lugar 99 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido en la experiencia</strong>, cerrando con una pérdida acumulada de -47,9 pts frente a la primera semana analizada, un retroceso que además se confirma como estadísticamente significativo. La trayectoria muestra caídas que no lograron ser compensadas, dejando al indicador en un nivel muy exigente para la gestión diaria y con presión directa sobre la consistencia del servicio.", "dondePonerFoco" ja respecto a la semana anterior. Aparecen menciones a productos en mal estado o con problemas de calidad, incluyendo casos en carnes y pollo con mal olor, además de observaciones puntuales en frutas y pastelería. Se sugiere reforzar controles de frescura por turno, retiro preventivo de productos con riesgo y trazabilidad de reclamos en perecibles para corregir origen y manipulación en sala."}, {"id": "0180", "nombre": "0180 Ñuñoa (Irarrazaval)", "kpiEvolutivo": [47.9, 50.6, 49.7, 31.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 31,8 pts</strong>, bajando -17,9 pts respecto a la semana previa y ubicándose en el lugar 78 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro sostenido y estable en la experiencia</strong>, cerrando con una contracción acumulada de -16,1 pts frente a la primera semana analizada, un movimiento que además es estadísticamente significativo y confirma un retroceso real que la gestión no ha logrado compensar con repuntes intermedios.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 20,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a falta de stock y reposición lenta, con clientes indicando que no encontraron productos específicos o que “faltaban cosas” en su lista. Se sugiere reforzar reposición en sala con chequeos por franjas horarias y foco en quiebres recurrentes, dejando responsables y tiempos de reposición visibles para el equipo.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 40,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios aparece la percepción de “poca variedad” para un formato express y faltantes de alternativas en categorías puntuales, incluyendo menciones a opciones veganas y productos específicos. Se sugiere ajustar el surtido mínimo por categoría y asegurar alternativas sustitutas visibles en góndola cuando el producto principal no esté disponible.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 47,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones a precios poco claros, artículos sin precio y diferencias entre góndola y boleta, además de comentarios sobre promociones confusas. Se sugiere implementar una rutina diaria de verificación de flejes y precios críticos, priorizando lácteos, panadería y zonas de alta rotación, y reforzar el control de coherencia góndola-caja.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 55,0 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas abiertas, filas largas y fricción en autoservicio, incluyendo cierres de módulos, demoras por autorizaciones y confusión con el escaneo de boleta para salir. Se sugiere ajustar dotación y apertura de cajas según picos, asegurar apoyo activo en autoservicio y estandarizar una guía simple y visible del flujo de salida para reducir tiempos y discusiones.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 67,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparece alguna mención a incomodidad por no tener dónde dejar el carrito y fricciones asociadas al flujo en zonas de cajas. Se sugiere ordenar un punto único y señalizado de devolución/estacionamiento de carros y revisar el layout cercano a cajas para evitar acumulación y bloqueos en horas punta."}, {"id": "0182", "nombre": "0182 Buin (Bernardo O´Higgins)", "kpiEvolutivo": [54.5, 50.2, 49.2, 48.9], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 48,9 pts</strong>, bajando -0,3 pts respecto a la semana previa y ubicándose en el lugar 24 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se observa un deterioro estructural y neto en la percepción del cliente</strong>, cerrando con una pérdida acumulada de -5,6 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. Esto sugiere que, más allá de la variación reciente acotada, la experiencia viene cediendo de forma sostenida y requiere contención operativa para evitar que la caída se profundice.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 48,7 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. En comentarios se repiten menciones a precios percibidos como altos y a que algunas ofertas no resultan realmente convenientes por formato o comparación local. Se sugiere reforzar señalética y consistencia de precios y promociones en sala, asegurando cumplimiento en caja y revisión diaria de productos sin precio.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 66,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparecen menciones puntuales a productos vencidos y a una percepción de deterioro en frutas y verduras en comparación con otros momentos. Se sugiere intensificar controles de fechas y rotación, con recorridos de merma más frecuentes y responsables claros por sección en horarios de mayor flujo.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 53,8 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Se repiten menciones a esperas largas, cajas cerradas y fricciones en autoservicio, además de algunos casos de atención poco empática en caja. Se sugiere ajustar dotación y apertura de cajas por tramos horarios, reforzar apoyo en autoservicio y alinear un estándar de trato y resolución rápida ante incidencias en el pago."}, {"id": "0244", "nombre": "0244 Outlet Park", "kpiEvolutivo": [62.9, 50.8, 50.6, 53.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 53,5 pts</strong>, subiendo +2,9 pts respecto a la semana previa y ubicándose en el lugar 11 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>El desempeño de las últimas 4 semanas muestra un deterioro estructural y sostenido</strong>, cerrando con una pérdida acumulada de -9,4 pts frente a la primera semana analizada, un retroceso estadísticamente significativo que no logró ser compensado en los cortes intermedios y que exige foco operativo para frenar la caída.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 34,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta una baja respecto a la semana anterior. En comentarios aparecen menciones a quiebres de stock y productos que no estaban disponibles o no se encontraban, incluso cuando figuraban en web. Se sugiere reforzar reposición en sala con revisión diaria de top quiebres y validación de consistencia sala versus sistema, priorizando categorías de alta búsqueda.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 39,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a precios de góndola poco claros o distintos a caja, promociones que no se aplican como el cliente espera y falta de precios visibles en algunos productos. Se sugiere ejecutar un control de “precio exhibido vs precio cobrado” por pasillo y cabeceras, más refuerzo de señalética simple en ofertas para evitar confusiones en el momento de compra.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 46,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece la percepción de menor variedad en algunas categorías específicas, como sin lactosa, productos saludables, quesos/fiambres y ciertos perecibles. Se sugiere levantar un listado corto de categorías “faltantes” recurrentes y ajustar surtido mínimo por misión de compra, con seguimiento semanal de cumplimiento en sala.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 58,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones puntuales a verduras/frutas en mal estado y dudas sobre frescura en secciones como carnes y envasados. Se sugiere reforzar rutinas de revisión por horarios en perecibles, retiro preventivo y reposición con estándar visible de frescura para reducir incidentes que deterioran la confianza.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 51,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones a percepción de alza de precios y comparación desfavorable con otras cadenas, además de fricción por cobro de estacionamiento y ausencia de descuento asociado a compra. Se sugiere asegurar competitividad en una canasta corta de productos sensibles y comunicarla en sala, junto con gestionar una solución operativa de validación de estacionamiento para compras sobre un umbral definido.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 65,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aunque hay varios comentarios positivos, también aparecen casos de trato poco cordial y demoras en resolver solicitudes en servicio al cliente y supervisión de cajas. Se sugiere reforzar presencia de jefatura en puntos de fricción y un estándar de resolución rápida en mesón, con recordatorio de trato y contención en momentos de alta demanda.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 73,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios se alternan experiencias expeditas con menciones a pocas cajas operativas, esperas largas y sobrecarga en autoservicio por falta de apoyo. Se sugiere ajustar dotación por franja horaria y asegurar apoyo dedicado en autoservicio, además de resguardar la caja preferencial para evitar esperas excesivas."}, {"id": "0425", "nombre": "0425 Copiapo", "kpiEvolutivo": [66.0, 46.4, 42.3, 52.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 52,5 pts</strong>, subiendo +10,2 pts respecto a la semana previa y ubicándose en el lugar 14 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>Aun con la recuperación de la última semana, el local enfrenta un balance de mediano plazo crítico</strong>: en las últimas 4 semanas se registraron repuntes temporales, pero la inestabilidad terminó por pasar factura y consolidó un retroceso severo de -13,5 pts respecto al inicio del ciclo, con un movimiento estadísticamente significativo que exige foco para evitar que la mejora reciente se diluya.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 40,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a góndolas vacías, falta de reposición y productos que no se encuentran, incluyendo casos puntuales en categorías específicas. Se sugiere reforzar reposición en horarios de mayor flujo, asegurar quiebres cero en básicos y activar revisión diaria de faltantes por sala con responsables claros.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 43,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a pocas cajas habilitadas, filas largas y problemas en cajas de autoservicio y preferencial que terminan extendiendo la espera. Se sugiere ajustar dotación y apertura de cajas por franja horaria, ordenar el uso de caja preferencial y asegurar apoyo activo en autoservicio para destrabar incidencias en el momento.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,8 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones a etiquetas mal puestas, precios que no corresponden entre góndola y caja y demoras por autorizaciones de cambio de precio. Se sugiere implementar una rutina de verificación de etiquetas y precios antes de horas punta, y un protocolo ágil de resolución en caja para diferencias de precio sin hacer esperar al cliente.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 46,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones a menor variedad en categorías como carnes, helados, productos específicos y alternativas como sin gluten, además de comentarios de que “antes había más opciones”. Se sugiere levantar un listado corto de categorías con mayor reclamo y asegurar surtido mínimo por semana, con revisión de planograma y reposición prioritaria en esas familias.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 65,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aunque hay varios comentarios valorando precios y promociones, también aparecen menciones a alzas, falta de ofertas y percepción de precios altos en ocasiones puntuales. Se sugiere reforzar señalización de ofertas vigentes, asegurar consistencia de precios en sala versus caja y priorizar comunicación de “buen precio” en productos sensibles para el cliente local."}, {"id": "0426", "nombre": "0426 Los Angeles (Sor Vicenta)", "kpiEvolutivo": [52.4, 43.8, 40.0, 47.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 47,5 pts</strong>, subiendo +7,5 pts respecto a la semana previa y ubicándose en el lugar 28 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\nEn una mirada de las últimas 4 semanas, <strong>aunque el balance final muestra una variación neta menor de -4,9 pts que no marca un cambio estadísticamente significativo, la operación interna estuvo sujeta a inestabilidad</strong>. Esto sugiere que el resultado actual convive con semanas de desempeño irregular, por lo que el desafío es sostener la mejora reciente y reducir los baches que afectan la consistencia de la experiencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 45,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Algunos comentarios apuntan a falta de precios en pasillos, diferencias entre precio en góndola y cobro en caja, y menor percepción de ofertas en ciertos momentos. Se sugiere reforzar la ejecución de etiquetado y señalética en sala, y activar un control diario de coherencia góndola-caja con resolución en el momento.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 45,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a precios percibidos como más altos que antes o versus otros supermercados, además de reclamos por promociones insuficientes o poco visibles. Se sugiere asegurar consistencia de precios clave, reforzar comunicación de promociones vigentes y revisar quiebres de oferta promocional en categorías sensibles.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 48,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. En comentarios aparece de forma recurrente la falta de stock, estantes vacíos y reposición insuficiente, incluyendo casos donde el cliente no encuentra lo que fue a buscar. Se sugiere ajustar reposición en horarios de mayor flujo, priorizar top ventas y mejorar la visibilidad de sustitutos cuando haya quiebres para evitar recorridos y frustración en sala."}, {"id": "0456", "nombre": "0456 Temuco Barros Arana", "kpiEvolutivo": [65.7, 43.9, 39.8, 45.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de
