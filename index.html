dades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 51,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado. En comentarios aparecen menciones a precios percibidos como altos y a diferencias entre el precio en góndola y lo cobrado en caja, lo que genera molestia y desconfianza. Se sugiere reforzar control de precios y promociones en sala y caja, con revisión diaria de etiquetas y resolución rápida de reclamos en el punto de pago.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 45,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado. Algunos comentarios apuntan a quiebres de stock en productos buscados y reposición lenta, incluyendo faltantes en secciones específicas. Se sugiere activar un plan de reposición por horarios críticos y mejorar la visibilidad de sustitutos, apoyando a sala con puntos de consulta y respuesta rápida ante faltantes.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 65,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a carros en mal estado, suciedad y desorden en el área de carros, además de pasillos obstaculizados por carros de reposición. Se sugiere implementar rondas de orden y sanitización con responsable por turno, retirar carros defectuosos y despejar accesos en horas punta para asegurar circulación fluida."}, {"id": "0518", "nombre": "0518 Valparaiso (Av. Argentina)", "kpiEvolutivo": [53.6, 44.1, 42.6, 39.5], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 39,5 pts</strong>, bajando -3,1 pts respecto a la semana previa y ubicándose en el lugar 54 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro sostenido y estable en la experiencia</strong>, cerrando con una contracción acumulada de -14,1 pts frente a la primera semana analizada, con un quiebre estadísticamente significativo que confirma un debilitamiento real en el balance del periodo y exige contención operativa para evitar que la caída se siga profundizando.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 45,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Algunos comentarios apuntan a falta de variedad en categorías específicas y a que “no había todo lo que buscaba”. Se sugiere reforzar reposición y surtido en categorías sensibles, con revisión diaria de quiebres y sustitutos visibles en sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 41,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Se repiten menciones a productos que no estaban disponibles y a poca reposición, incluyendo casos de compras donde faltaron ítems clave. Se sugiere activar un plan corto de reposición por franjas horarias y mejorar la señalización de quiebres y alternativas para reducir frustración en sala.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 49,1 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Aparecen menciones a precios en góndola que no coinciden en caja y a ofertas que “no se respetan” o no se reflejan en autoservicio. Se sugiere implementar un control diario de flejes y precios críticos, más un punto de resolución rápida en cajas para ajustar diferencias sin fricción.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 69,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios se observan alertas por carne o pollo en mal estado, además de fruta/verdura con problemas de frescura y presencia de mosquitos en el área. Se sugiere reforzar controles de calidad por lote y por horario, retiro preventivo de productos dudosos y una rutina visible de limpieza y merma en sala de perecibles.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 66,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a malos tratos en caja y autoservicio, falta de apoyo, y experiencias tensas con guardias desde el ingreso. Se sugiere alinear un estándar mínimo de trato y apoyo en cajas y autoservicio, con supervisión en piso en horas punta y refuerzo específico en saludo, disposición y resolución.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 62,3 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones a falta de carros y canastos, carros sucios y dificultad para encontrar carros al ingreso. Se sugiere asegurar recuperación de carros desde estacionamiento con rondas programadas, habilitar un punto de acopio visible y sumar una rutina de limpieza rápida para carros en horarios de mayor flujo."}, {"id": "0606", "nombre": "0606 Lider Coronel", "kpiEvolutivo": [19.6, 56.3, 55.2, 51.9], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 51,9 pts</strong>, bajando -3,3 pts respecto a la semana previa y ubicándose en el lugar 16 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En el balance de las últimas 4 semanas, se observa una trayectoria de mejora sólida y sostenida en el tiempo.</strong> El local consolida un avance neto de +32,2 pts frente a la primera semana analizada, con un movimiento significativo que valida una mejora real en la consistencia del servicio y deja una base más favorable para sostener el desempeño.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a diferencias entre el precio en góndola y el cobrado en caja, además de productos sin precio visible en las góndolas. Se sugiere reforzar la ejecución de cartelería y validación diaria de precios y promociones en sala y cajas, con corrección rápida ante desvíos.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 38,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a productos que no se encuentran, surtido más acotado que en otros locales y ofertas agotadas, incluyendo faltantes puntuales en categorías específicas. Se sugiere activar un control de quiebres por categorías críticas y un plan de reposición con responsables por pasillo, priorizando horarios de mayor flujo.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 36,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece que los precios se perciben más altos o similares a la competencia y que han bajado la calidad de las ofertas respecto a antes. Se sugiere asegurar consistencia de “precio destacado” en básicos y comunicar mejor las ofertas vigentes en sala y en la app, evitando quiebres de promociones que erosionen la percepción de conveniencia.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 36,4 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Se repiten menciones a falta de reposición, estantes vacíos y desorden en pasillos por reposición en horarios de alto flujo, además de reclamos por reposición tardía. Se sugiere ordenar una rutina de reposición más temprana y por ventanas horarias, con verificación de sala en horas punta y despeje de pasillos para no bloquear la compra.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 52,3 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Aparecen menciones a pollo y carnes en mal estado, además de casos en huevos y productos envasados con problemas de frescura. Se sugiere reforzar controles de recepción y rotación, revisión de fechas y condición de producto en sala, y un protocolo de retiro inmediato ante alertas para evitar recurrencia.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 63,6 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aunque hay varios comentarios positivos hacia cajeras y personal, también se repiten menciones a malos tratos y situaciones tensas con guardias, además de atención desganada en algunos puntos. Se sugiere alinear estándares de trato y resolución en primera línea, con foco específico en seguridad y cajas, reforzando supervisión en sala y manejo de reclamos en el momento.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 34,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas abiertas en horarios peak, filas extensas y fricciones en cajas rápidas por fallas o falta de apoyo. Se sugiere ajustar dotación y apertura dinámica por tramos horarios, asegurar continuidad operativa de cajas rápidas y disponer apoyo visible para destrabar incidencias sin frenar el flujo."}, {"id": "0607", "nombre": "0607 Lider Melipilla", "kpiEvolutivo": [58.5, 52.3, 55.1, 48.2], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 48,2 pts</strong>, bajando -6,9 pts respecto a la semana previa y ubicándose en el lugar 26 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y neto en la percepción del cliente, con una caída acumulada de -10,2 pts que además es estadísticamente significativa.</strong> Esto refleja una trayectoria estable a la baja, donde las contracciones no han logrado ser compensadas con repuntes que frenen la pérdida de experiencia en el cierre del ciclo.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 35,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a falta de variedad y a que no se encuentra todo lo buscado, incluyendo necesidades específicas como productos para celíacos. Se sugiere reforzar surtido y reposición por categorías críticas y revisar quiebres recurrentes con un control diario de faltantes en sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 31,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. En comentarios aparece de forma reiterada el “poco stock”, estantes vacíos y faltantes de básicos, tanto en tienda como en compras online con productos no entregados. Se sugiere activar un plan de reposición más visible en sala y un seguimiento de quiebres por top ventas, junto con una validación más estricta de picking para evitar faltantes en pedidos.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 44,4 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a dificultad para consultar precios, flejes pequeños o ausentes y percepción de ofertas poco claras o “infladas”. Se sugiere reforzar señalética y flejes en góndola, habilitar más puntos de consulta de precio y auditar diariamente coherencia entre precio publicado y cobro en caja.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 44,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a precios “muy elevados” o “cada vez más caros”, y a dudas sobre si las ofertas son realmente convenientes. Se sugiere asegurar ejecución de precios y promociones en sala, priorizando una revisión de categorías sensibles y un control de diferencias de precio en caja para reducir fricción."}, {"id": "0608", "nombre": "0608 Lider Chillan", "kpiEvolutivo": [60.6, 50.0, 48.6, 57.1], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 57,1 pts</strong>, subiendo +8,5 pts respecto a la semana previa y ubicándose en el lugar 6 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>A lo largo de las últimas 4 semanas, el NPS mostró un comportamiento volátil sin un cambio neto relevante en el balance final.</strong> En términos acumulados, el indicador cierra con una variación de -3,5 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística, aunque con oscilaciones internas que sugieren semanas con ejecución dispar  pts frente a la primera semana analizada. Aun cuando este movimiento se mantiene sin significancia estadística, el recorrido sugiere una recuperación que conviene consolidar para evitar retrocesos en los próximos cortes.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 37,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a diferencias entre el precio en góndola y el cobrado en caja, además de necesidad de verificar valores varias veces o falta de respeto del precio publicado. Se sugiere reforzar la ejecución de flejes y cartelería, con validación diaria de precios críticos y un protocolo único de resolución en caja y atención al cliente.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 20,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Aparecen menciones a poca variedad en categorías específicas y necesidades no cubiertas, como opciones veganas/vegetarianas, productos sin gluten más ordenados y faltantes recurrentes de algunos ítems. Se sugiere levantar un listado corto de categorías “sensibles” para la clientela del local y asegurar surtido mínimo visible, con señalización clara para facilitar el hallazgo.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 52,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparecen algunas menciones a productos en mal estado o con problemas de inocuidad, especialmente en carnes y preparados, lo que tensiona la confianza aun cuando el nivel neto no es bajo. Se sugiere reforzar controles de temperatura, rotación y retiro preventivo en vitrinas, además de una revisión puntual de proveedores y manipulación en horarios de mayor demanda.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 52,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios se observa sensibilidad a alzas y percepción de precios altos en algunos productos, junto con menciones positivas a ofertas cuando están bien ejecutadas. Se sugiere asegurar consistencia entre comunicación de ofertas y disponibilidad real, y priorizar una canasta corta de “precio imagen” con seguimiento semanal de brechas.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 20,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Se repiten menciones a quiebres de stock, góndolas sin reposición y dificultad para encontrar productos habituales, lo que obliga a sustituir compras o ir a otros supermercados. Se sugiere ordenar reposición por franjas horarias, despejar pasillos de pallets en horas punta y activar reposición rápida para top faltantes del día.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 56,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aunque hay varios comentarios destacando rapidez y buena atención, también aparecen casos de esperas muy largas y fricción en autoservicio por falta de apoyo o incidencias de precios que traban la fila. Se sugiere ajustar dotación y apertura dinámica en picos, y reforzar soporte visible en autoservicio para destrabar validaciones y correcciones sin detener la línea."}, {"id": "0618", "nombre": "0618 Casona Osorno", "kpiEvolutivo": [70.2, 50.4, 45.0, 33.9], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 33,9 pts</strong>, bajando -11,0 pts respecto a la semana previa y ubicándose en el lugar 73 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>Se observa un deterioro estructural y neto en la percepción del cliente a lo largo de las últimas 4 semanas</strong>, acumulando una contracción de -36,2 pts frente a la primera semana analizada. Este retroceso es estadísticamente significativo y refleja una caída sostenida que no logró ser compensada en los cortes intermedios, dejando al indicador en un nivel que exige correcciones operativas consistentes.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 31,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a góndolas vacías, falta de reposición y quiebres en secciones específicas, además de fricción en compras online por faltantes y sustituciones. Se sugiere reforzar la reposición en horas punta, asegurar revisión de quiebres por sala y pickup, y activar un control diario de top SKUs faltantes con responsables por sección.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 51,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aunque aparecen comentarios positivos sobre cajeras y guardias, también se repiten menciones a trato poco amable, falta de apoyo en sala y derivaciones sin solución cuando el cliente pide ayuda. Se sugiere estandarizar un protocolo simple de apoyo en sala y cajas, con supervisión visible en momentos de alta afluencia y refuerzo de conductas de servicio en puntos críticos como cajas rápidas, atención al cliente y retiro pickup.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 44,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a diferencias entre precio publicado y cobro en caja, productos en liquidación que no pasan por cajas rápidas y falta de precios visibles en góndola. Se sugiere implementar una revisión diaria de coherencia oferta-góndola-caja, asegurar etiquetado y precios en sala, y habilitar un mecanismo rápido de corrección en caja para evitar que el cliente abandone la compra."}, {"id": "0620", "nombre": "0620 Hiper Nos", "kpiEvolutivo": [50.6, 55.5, 54.6, 50.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 50,8 pts</strong>, bajando -3,8 pts respecto a la semana previa y ubicándose en el lugar 19 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>la gestión ha mostrado una trayectoria plana y lineal, consolidando un escenario de estancamiento o inmovilidad estructural en la experiencia del cliente</strong>, donde el indicador cierra con una variación marginal de +0,1 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística y que no altera el balance operacional. En este contexto, el desafío es evitar que caídas puntuales como la de esta semana se vuelvan recurrentes y terminen moviendo el nivel base del local.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 54,4 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Algunos comentarios apuntan a quiebres de stock y repisas vacías, con clientes indicando que no encontraron todo lo que buscaban o que faltaba reposición en góndolas. Se sugiere reforzar reposición en sala con chequeos por franjas horarias y foco en categorías de alta rotación, asegurando sustitutos visibles cuando falte el producto.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 59,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparecen menciones a trato poco empático y baja disposición de apoyo, especialmente en cajas y autoservicio, además de situaciones de tensión con guardias al cierre o en la salida. Se sugiere alinear rutinas de atención en momentos críticos como cierre, filas y autoservicio, con supervisión en piso y refuerzo de criterios de trato y apoyo al cliente.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 71,9 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios aparece alguna mención a dificultades operativas asociadas al flujo de compra, como poco cupo o fricción al desplazarse, lo que suele amplificar la necesidad de carros disponibles en accesos. Se sugiere asegurar un circuito de recuperación y redistribución de carros en horas punta, con responsable por turno y puntos de acopio visibles en entradas."}, {"id": "0626", "nombre": "0626 Principe De Gales", "kpiEvolutivo": [34.5, 51.1, 52.1, 40.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 40,4 pts</strong>, bajando -11,7 pts respecto a la semana previa y ubicándose en el lugar 49 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se observa una tendencia general al alza, pero con un comportamiento volátil que refleja avances y retrocesos intermedios antes de consolidar el resultado actual</strong>, cerrando con un repunte acumulado de +5,9 pts frente a la primera semana analizada, en un movimiento estadísticamente significativo que confirma una mejora real en el balance del ciclo.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 39,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a quiebres de stock, estanterías sin reposición y pedidos online incompletos o con reemplazos percibidos como de menor calidad. Se sugiere reforzar reposición y control de sala en categorías críticas y, en paralelo, ajustar la gestión de sustituciones y comunicación en picking para reducir fricción cuando falte producto.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 51,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Aparece alguna mención a poca variedad versus otros supermercados y faltantes de marcas o formatos específicos, incluyendo necesidades más “de nicho” como importados o alternativas especiales. Se sugiere revisar surtido por misión de compra y asegurar presencia mínima de marcas y formatos clave, con señalización clara de alternativas cuando no haya stock.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 60,0 pts en la última semana. Este atributo fue priorizado porque se incluye por su peso relativo dentro de los atributos evaluados. En comentarios se repiten menciones positivas a ofertas, pero también aparecen fricciones por precios mal exhibidos, diferencias entre góndola y caja y necesidad de validar valores. Se sugiere fortalecer la ejecución de precios en sala con chequeos diarios de cartelería y un protocolo simple en cajas para resolver discrepancias sin escalar ni generar reprocesos al cliente."}, {"id": "0628", "nombre": "0628 Hiper Santa Cruz", "kpiEvolutivo": [46.2, 58.3, 57.9, 52.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 52,5 pts</strong>, bajando -5,4 pts respecto a la semana previa y ubicándose en el lugar 14 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>A pesar de enfrentar semanas inestables o baches en el camino, se logró sobreponer y consolidar un quiebre favorable en el mediano plazo</strong>, acumulando un repunte sustancial de +6,3 pts en comparación con el inicio del ciclo. En la práctica, esto sugiere que la experiencia viene mejorando en el balance de las últimas 4 semanas, aunque con oscilaciones que pueden revertir avances si no se controlan los puntos operativos más sensibles.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 48,6 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. En comentarios aparece que algunos descuentos no se reflejan en caja y se pierde tiempo validando precios, lo que genera fricción al cierre de la compra. Se sugiere reforzar la consistencia precio góndola-caja con chequeos diarios de ofertas activas y un protocolo rápido de resolución en cajas.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 34,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a faltantes de productos y marcas, sustituciones que no cumplen expectativas y casos de productos en mal estado o con quiebre de frío. Se sugiere asegurar reposición en sala en horarios críticos, reforzar control de cadena de frío en perecibles y mejorar la gestión de sustituciones para evitar pérdida de confianza.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 45,7 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. En comentarios se repiten percepciones de precios altos y pocas ofertas atractivas, además de variaciones de precios de una semana a otra. Se sugiere priorizar señalización simple de “mejor precio” en categorías sensibles y asegurar comunicación clara de promociones vigentes para reducir la sensación de sobreprecio.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 74,3 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aparece alguna mención a falta de carros en accesos específicos y a la necesidad de carros más pequeños para compras rápidas. Se sugiere ordenar un circuito de recuperación y redistribución de carros por accesos, con reposición frecuente en horas punta y una dotación mínima visible en la entrada principal.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 34,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a largas filas, pocas cajas operativas, lentitud en cajas y fallas en autoservicio o cajas express que traban el flujo. Se sugiere ajustar dotación por franja horaria, asegurar continuidad operativa de autoservicio con soporte en sala y activar un plan de apertura rápida de cajas cuando se disparen las filas."}, {"id": "0631", "nombre": "0631 Hiper Collao", "kpiEvolutivo": [50.0, 46.3, 45.0, 36.1], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 36,1 pts</strong>, bajando -9,0 pts respecto a la semana previa y ubicándose en el lugar 65 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido</strong>, cerrando con una pérdida acumulada de -13,9 pts frente a la primera semana analizada, con un movimiento estadísti rio de coherencia cartel-góndola-caja y un protocolo de resolución en primera línea para evitar derivaciones y esperas prolongadas.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 58,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios aparece percepción de “muy caro”, promociones poco atractivas y alzas versus visitas anteriores, lo que tensiona la evaluación del valor. Se sugiere reforzar comunicación de precios clave y promociones realmente vigentes, priorizando visibilidad en sala de productos gancho y consistencia de precios en caja.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 68,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparecen menciones a carne o jamón en mal estado y a verdulería poco fresca, lo que impacta confianza y recompra. Se sugiere endurecer controles de recepción y rotación, con revisión de mermas por turno y retiro preventivo ante reclamos recurrentes.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 55,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se observan relatos de trato inadecuado y baja disposición en caja/servicio al cliente, incluyendo demoras extensas para resolver problemas simples. Se sugiere reforzar supervisión en momentos de alta demanda y un estándar de trato y resolución rápida, con escalamiento claro para evitar “tramitaciones”.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 41,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a filas largas, lentitud en cajas y fricción en autoservicio, especialmente en días de alta afluencia. Se sugiere ajustar dotación y apertura de cajas por franjas horarias, reforzar apoyo en autoservicio y activar un plan de contingencia para picos con monitoreo de tiempos en línea.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 65,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a falta recurrente de carros y canastos, con impacto directo en la fluidez de compra. Se sugiere asegurar recuperación continua de carros desde estacionamientos y pasillos, con responsable por turno y puntos de acopio visibles para evitar quiebres en horas punta."}, {"id": "0635", "nombre": "0635 Arica (Pedro Montt)", "kpiEvolutivo": [59.6, 54.5, 56.2, 56.9], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 56,9 pts</strong>, subiendo +0,6 pts respecto a la semana previa y ubicándose en el lugar 7 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En el acumulado de las últimas 4 semanas, la unidad muestra un deterioro leve pero sostenido en su balance general</strong>, cerrando con una variación neta de -2,8 pts frente a la primera semana analizada, un movimiento que se mantiene sin significancia estadística. En la práctica, esto sugiere que el desempeño se ha ido ajustando a la baja de forma gradual, por lo que conviene evitar que pequeñas fricciones operativas se vuelvan recurrentes y terminen presionando el indicador.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 47,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado. En comentarios aparece con fuerza la falta de stock y la necesidad de reposición en góndolas, además de menciones a que “no había producto que buscaba”. Se sugiere reforzar la disciplina de reposición en sala con revisión por quiebres en horarios punta y validación diaria de top SKUs faltantes.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 60,0 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Algunos comentarios apuntan a falta de alternativas en categorías específicas y a una sensación de desorden en sala que dificulta encontrar opciones. Se sugiere ordenar exhibiciones tipo isla y pasillos para mejorar navegabilidad, y levantar un listado corto de categorías con menor surtido percibido para ajustar el mix local.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 77,5 pts en la última semana. Este atributo fue priorizado porque se incluye por su peso relativo dentro de los atributos evaluados. Aunque el nivel es alto, aparecen menciones puntuales a verdura poco fresca y pan en condición mejorable, lo que puede erosionar la percepción si se repite. Se sugiere asegurar rutinas de revisión y retiro oportuno en perecibles, con foco en verduras y panadería en los tramos de mayor rotación."}, {"id": "0638", "nombre": "0638 Express Panguipulli", "kpiEvolutivo": [29.4, 43.3, 38.6, 12.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 12,5 pts</strong>, bajando -26,1 pts respecto a:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 20,0 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de presentar una baja respecto a la semana anterior. Se repiten menciones a falta de stock, productos que aparecen disponibles pero no están, y quiebres que obligan a llevar alternativas. Se sugiere reforzar reposición en sala con revisión por franjas horarias y un control diario de quiebres en categorías críticas.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 22,5 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. En comentarios aparece de forma recurrente la sensación de “no encontrar todo”, menor surtido en categorías específicas y diferencias frente a otros locales, especialmente en productos de compra habitual. Se sugiere ajustar el mix a la demanda local y asegurar reposición de SKUs clave, con seguimiento semanal de faltantes más mencionados.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 47,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparece alguna mención a ausencia de canastos y fricción en la compra rápida cuando no hay apoyo de elementos de acarreo. Se sugiere implementar control de disponibilidad por turnos y un responsable de reposición de carros y canastos en horas punta.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 55,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a perecibles en mal estado o poco frescos, como paltas y carnes, además de observaciones puntuales sobre cadena de frío y productos con fechas antiguas. Se sugiere reforzar controles de recepción y sala en perecibles, con retiro preventivo y revisión de temperatura en momentos de mayor calor.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 65,0 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. En general se menciona rapidez, pero aparecen casos de lentitud en cajas rápidas y falta de apoyo del personal en autoservicio cuando hay flujo. Se sugiere asegurar cobertura activa en autoservicio y habilitación dinámica de cajas según fila, especialmente en horarios de mayor afluencia.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a percepción de precios altos, diferencias de precio entre locales y fricciones por precios que no coinciden con góndola u ofertas no aplicadas en caja. Se sugiere reforzar la ejecución de precios y ofertas en sala, con revisión diaria de etiquetas y un protocolo rápido de corrección ante reclamos en caja."}, {"id": "0650", "nombre": "0650 Ex Algarrobo", "kpiEvolutivo": [40.6, 46.0, 43.0, 41.0], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 41,0 pts</strong>, bajando -2,0 pts respecto a la semana previa y ubicándose en el lugar 47 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue s ndimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Aparecen menciones a precios poco claros, diferencias entre góndola y caja, y problemas con señalización y flejes. Se sugiere implementar un chequeo diario de flejes y precios por sección, con validación en caja rápida y un protocolo de corrección inmediata cuando el precio no coincide.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 46,7 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a carnes en mal estado o cercanas a vencimiento, huevos en mal estado y dudas por etiquetado y fechas, lo que genera desconfianza en la compra. Se sugiere reforzar control de fechas y rotación en carnicería y lácteos, con revisión por turnos y retiro preventivo de productos con riesgo, además de asegurar trazabilidad visible en etiquetado."}, {"id": "0670", "nombre": "0670 Puerto Montt (Cardonal)", "kpiEvolutivo": [59.0, 44.7, 44.1, 51.4], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 51,4 pts</strong>, subiendo +7,2 pts respecto a la semana previa y ubicándose en el lugar 18 de 106 unidades evaluadas. <strong>Este avance consolida un quiebre estadísticamente significativo respecto al periodo previo, validando una mejora real en la consistencia del servicio.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>En el balance de las últimas 4 semanas, el local muestra una tendencia a la baja con comportamiento volátil</strong>, cerrando con una contracción acumulada de -7,6 pts frente a la primera semana analizada. Este retroceso es estadísticamente significativo y sugiere que, pese al repunte reciente, la experiencia aún no logra sostener una recuperación consistente semana a semana.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 56,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones a buenas ofertas, pero también a alzas percibidas y a frustración por diferencias entre precios en góndola y cobro en caja o por ofertas no respetadas. Se sugiere reforzar control diario de flejes y precios, y un protocolo simple de validación y respeto de ofertas en caja para evitar reclamos en el momento de pago.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 46,7 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a quiebres de stock, desabastecimiento en la tarde y reposición tardía, además de falta de apoyo para ubicar productos. Se sugiere ajustar reposición en horarios de mayor demanda, levantar un listado corto de “top quiebres” por sala y asegurar presencia visible de apoyo en pasillos para consultas.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 60,0 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a carne y pollo en mal estado, frutas y verduras deterioradas y casos puntuales de higiene, lo que tensiona la confianza aun cuando el nivel neto se mantiene alto. Se sugiere reforzar controles de recepción y vitrina por turnos, retiro preventivo de productos con dudas y un circuito istencias de precios entre locales, lo que termina generando desconfianza y fricción al momento de pagar. Se sugiere implementar una rutina diaria de verificación de flejes y precios en góndola, con foco en ofertas y categorías reclamadas, y un responsable por turno para corregir desvíos antes de horas punta."}, {"id": "0679", "nombre": "0679 Iquique (Sur)", "kpiEvolutivo": [52.1, 49.0, 48.0, 34.0], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 34,0 pts</strong>, bajando -14,0 pts respecto a la semana previa y ubicándose en el lugar 72 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido, con un comportamiento estable a la baja</strong>, acumulando una contracción de -18,1 pts frente a la primera semana analizada, lo que confirma un retroceso significativo que no ha logrado ser compensado con repuntes relevantes en los cortes intermedios.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 41,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a ventas de temporada que duran poco y a clientes que no encuentran lo que buscan, además de quiebres entre el stock informado en la app y la disponibilidad en sala. Se sugiere reforzar reposición y exhibición en categorías de alta búsqueda y temporada, con revisión diaria de top faltantes y ajuste de consistencia app versus sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 37,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. En los comentarios aparece de forma recurrente desabastecimiento y estanterías vacías, junto con reclamos por falta de productos específicos y reposición poco constante. Se sugiere implementar rutinas de reposición por franjas horarias y un control visible de quiebres críticos, priorizando básicos y frescos para reducir “no había lo que buscaba”.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 56,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a trato poco cordial en cajas y sala, además de situaciones incómodas con guardias y revisiones a la salida que se perciben como agresivas o poco empáticas. Se sugiere reforzar estándares de trato y resolución en primera línea, con foco en cajas y seguridad, incluyendo pautas de disculpa y contención cuando hay errores de cobro o revisiones.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 47,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Se repiten menciones a pocas cajas abiertas, filas largas, autoservicio con equipos fuera de servicio y demoras por falta de apoyo oportuno, especialmente en horarios punta y fechas especiales. Se sugiere ajustar dotación y apertura de cajas por demanda, asegurar operatividad del autoservicio y asignar un apoyo activo en zona de cajas para destrabar incidencias y reducir esperas."}, {"id": "0681", "nombre": "0681 Pucon", "kpiEvolutivo": [66.7, 38.4, 39.3, 14.6], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 14,6 pts</strong>, bajando -24,7 pts respecto a la semana previa y ubicándose en el lugar 98 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,5 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro sostenido y estable en la experiencia</strong>, cerrando con una contracción acumulada de -52,0 pts frente a la primera semana analizada. Este resultado confirma un quiebre significativo en el balance del periodo y deja al indicador en un nivel que exige contención operativa inmediata para evitar que la caída se siga profundizando.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de -12,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Se repiten menciones a quiebres, estantes vacíos y reposición lenta, incluyendo faltantes de básicos y pedidos incompletos o que no llegan. Se sugiere reforzar reposición en sala con rutinas diarias de revisión de quiebres, responsables por categoría y un control de cumplimiento de picking para asegurar sustituciones y entregas completas.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 15,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. En comentarios aparece que el mix se percibe reducido para la demanda de la zona y que en temporada alta se extraña mayor surtido, además de menciones a marcas o líneas que “ya no se encuentran”. Se sugiere ajustar el surtido mínimo por temporada y asegurar cumplimiento del mix definido, con seguimiento semanal de SKUs críticos y reposición prioritaria en categorías de alta búsqueda.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparecen menciones a diferencias entre precio en góndola versus caja y a señalética de ofertas confusa o cambiada, lo que genera fricción al momento de pagar. Se sugiere implementar una revisión diaria de cartelería y precios en sala, con validación en caja de los productos en promoción y corrección rápida ante desvíos.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 41,0 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Se repiten menciones a filas largas, pocas cajas abiertas y esperas altas en momentos de mayor flujo, además de fricciones puntuales en cajas automáticas y en retiro de compras. Se sugiere reforzar dotación y apertura de cajas en franjas peak, sumar apoyo de anfitrión en autoservicio y ordenar un plan de contingencia para fines de semana, festivos y temporada alta.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 53,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios se observa sensibilidad por alzas de precios, comparaciones con competidores locales y reclamos por falta de consistencia entre precios online y en tienda. Se sugiere auditar semanalmente una canasta de productos clave versus competencia y asegurar coherencia de precios y comunicación en sala, priorizando correcciones rápidas en los ítems más reclamados.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 51,3 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Aparecen menciones puntuales a productos en mal estado, especialmente en carnes y algunos frescos, junto con observaciones de fruta/verdura que no cumple expectativa. Se sugiere reforzar controles de recepción y rotación, retirar de inmediato productos con merma visible y aumentar la frecuencia de revisión en vitrinas y góndolas de perecibles.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 66,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aunque hay varios comentarios positivos sobre amabilidad y buena disposición, también aparecen casos puntuales de mal trato en caja y falta de apoyo en sala en momentos de alta demanda. Se sugiere reforzar estándares de atención en caja y sala con supervisión en terreno, coaching breve en manejo de reclamos y asegurar presencia visible de apoyo cuando el local está más lleno."}, {"id": "0682", "nombre": "0682 Hi San Joaquin", "kpiEvolutivo": [53.9, 41.6, 41.1, 39.1], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 39,1 pts</strong>, bajando -1,9 pts respecto a la semana previa y ubicándose en el lugar 56 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>Se observa un deterioro estructural y sostenido en el mediano plazo</strong> durante las últimas 4 semanas, cerrando con una contracción acumulada de -14,8 pts frente a la primera semana analizada, en un movimiento estadísticamente significativo que confirma una pérdida real de consistencia en la experiencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 39,7 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales, además de haber mostrado una baja durante el tiempo analizado. Se repiten menciones a largas filas, pocas cajas habilitadas y bloqueos o lentitud en cajas, incluyendo autoservicio. Se sugiere ajustar dotación y apertura de cajas por franja horaria, reforzar apoyo en punta y asegurar respuesta rápida ante incidencias operativas en caja.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 37,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. En los comentarios aparece de forma recurrente la falta de stock y reposición lenta, con menciones a estantes vacíos y productos que no se encuentran pese a buscarlos. Se sugiere reforzar reposición en sala con foco en quiebres visibles, priorizar básicos y coordinar reposición fuera de horas de mayor flujo para no bloquear pasillos.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 48,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a diferencias entre precio de góndola y cobro en caja, ofertas que no aplican y lectores de precio que no funcionan. Se sugiere implementar una rutina diaria de verificación de flejes y precios en categorías con alta promoción, asegurar funcionamiento de verificadores y reforzar validación en caja para resolver diferencias sin fricción."}, {"id": "0684", "nombre": "0684 Hiper 4 Esquinas", "kpiEvolutivo": [35.2, 45.0, 44.8, 41.7], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 41,7 pts</strong>, bajando -3,2 pts respecto a la semana previa y ubicándose en el lugar 44 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn la mirada de las últimas 4 semanas, <strong>se observa una trayectoria de mejora sólida y sostenida en el mediano plazo</strong>, acumulando un avance neto de +6,5 pts desde la primera semana analizada, con un movimiento que además resulta estadísticamente significativo y valida una mejora real en la consistencia del servicio.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a carnes y pollo en mal estado o con mala selección, especialmente en compras online y en la preparación de pedidos. Se sugiere reforzar controles diarios de calidad por sección y un estándar de selección para picking, con rechazo inmediato de producto dudoso antes de llegar al cliente.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 35,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a “poca variedad” y a ausencia de marcas o productos específicos, lo que empuja a compras incompletas. Se sugiere ajustar surtido en categorías reclamadas y activar reposición focalizada con revisión semanal de quiebres recurrentes.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 33,3 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a no encontrar productos, desabastecimiento y faltantes en pedidos, lo que afecta la capacidad de resolver la compra completa. Se sugiere implementar un seguimiento diario de quiebres por top productos y mejorar sustituciones en online con autorización simple y visible para el cliente.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 76,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aunque el nivel actual es alto, conviene evitar que la caída se traduzca en fricción en horas punta. Se sugiere asegurar un circuito de recuperación y sanitización con responsable por turno y reposición activa en accesos en momentos de mayor flujo.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 35,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas habilitadas, filas largas y autoservicio con máquinas fallando o lentas, generando demoras relevantes. Se sugiere reforzar dotación en franjas críticas, habilitar una fila rápida operativa y asegurar soporte en sala para destrabar autoservicio y mantener equipos funcionando."}, {"id": "0686", "nombre": "0686 Hiper Reg. Arica", "kpiEvolutivo": [73.6, 50.8, 45.1, 28.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 28,8 pts</strong>, bajando -16,3 pts respecto a la semana previa y ubicándose en el lugar 86 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En el acumulado de las últimas 4 semanas se observa un deterioro estructural sostenido, con una trayectoria estable a la baja.</strong> El indicador arrastra una pérdida acumulada de -44,7 pts frente a la primera semana analizada, y este retroceso se confirma como estadísticamente significativo, dejando una señal clara de debilitamiento que requiere contención operativa y recuperación gradual.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 9,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a desabastecimiento y menor variedad que antes, con casos puntuales de productos específicos no encontrados. Se sugiere reforzar reposición por categorías críticas y revisar quiebres recurrentes con un control diario de sala y bodega en horarios punta.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 13,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece de forma reiterada la percepción de vitrinas vacías y falta de reposición en distintas secciones, incluyendo perecibles y congelados. Se sugiere implementar reposición visible en sala con responsables por zona y un “barrido” de quiebres en franjas de alta afluencia para evitar góndolas vacías.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 54,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aunque hay menciones positivas a precios convenientes, también aparecen reclamos por diferencias entre precio en góndola y cobro en caja, lo que erosiona confianza. Se sugiere reforzar auditorías diarias de flejes y precios en cajas en productos de alta rotación y activar un protocolo rápido de corrección cuando el cliente detecte discrepancias.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 47,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a carnes en mal estado u olor desagradable y a vitrinas con baja disponibilidad, lo que tensiona la percepción de calidad. Se sugiere intensificar controles de temperatura, rotación y merma en carnicería y perecibles, con revisión de exhibición y retiro preventivo en horarios de cierre.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 47,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen comentarios sobre pocas ofertas en comparación con otros supermercados y confusión por precios mal informados o no visibles. Se sugiere ordenar la comunicación en sala con señalética simple y consistente, y validar que toda promoción esté correctamente implementada en sistema y flejes antes de la apertura.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 45,5 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a esperas largas, pocas cajas abiertas y fricción con autoservicio, incluyendo percepción de lentitud en apoyo de caja. Se sugiere ajustar dotación y apertura de cajas por tramos horarios, reforzar apoyo activo en autoservicio y habilitar un plan de contingencia para picos de demanda con supervisión en línea.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 72,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aunque el nivel sigue alto, aparece como foco por su deterioro reciente y porque en semanas de alta afluencia puede volverse un irritante rápido. Se sugiere asegurar recuperación y redistribución de carros en accesos y estacionamientos, con rondas programadas en horas punta.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 68,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En general se reconoce buena atención, pero aparecen casos puntuales de trato poco amable en caja y baja disponibilidad de apoyo en pasillos cuando hay consultas. Se sugiere reforzar estándares de atención en cajas y sala con recordatorios operativos diarios y un responsable visible de apoyo en piso para resolver consultas y escalamientos rápidos."}, {"id": "0689", "nombre": "0689 Santiago (San Martín)", "kpiEvolutivo": [32.6, 47.0, 42.0, 37.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 37,5 pts</strong>, bajando -4,5 pts respecto a la semana previa y ubicándose en el lugar 60 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>Aunque el balance final de las últimas 4 semanas muestra una variación neta menor de +4,9 pts que no marca un cambio estadísticamente significativo, la operación interna estuvo sujeta a inestabilidad.</strong> En este contexto, el NPS se mantiene por debajo de la mayoría de locales, por lo que el desafío es reducir la variabilidad semana a semana y sostener estándares consistentes en sala y en cajas.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 11,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. En comentarios aparece reiteradamente la percepción de “poca variedad” y faltantes puntuales de categorías específicas. Se sugiere reforzar el surtido mínimo por misión de compra y asegurar reposición visible en góndola, con revisión diaria de quiebres en los top más buscados.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 14,7 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de a práctica, esto refleja una experiencia que ha tenido repuntes puntuales, pero que no han logrado sostenerse, dejando un balance final claramente deteriorado para la gestión del local.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 18,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a falta de variedad y a no encontrar productos específicos, incluyendo quiebres en categorías puntuales. Se sugiere reforzar el surtido y la reposición por categorías críticas, con revisión diaria de quiebres y sustitutos visibles en sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 18,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. En los comentarios aparece de forma recurrente la falta de stock, estantes vacíos y reposición insuficiente en secciones como carnes, pollos y otros básicos. Se sugiere asegurar rutinas de reposición en horas punta y un control de sala más estricto para evitar vacíos prolongados, priorizando los productos de mayor rotación.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 21,2 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas abiertas, filas largas y baja asistencia en autoservicio, especialmente en la mañana y en momentos de alta afluencia. Se sugiere ajustar la dotación y apertura de cajas por franja horaria, reforzando apoyo en autoservicio y activando un plan de contingencia cuando se formen filas sostenidas."}, {"id": "0697", "nombre": "0697 San Fernando", "kpiEvolutivo": [52.8, 42.7, 35.0, 35.3], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 35,3 pts</strong>, subiendo +0,3 pts respecto a la semana previa y ubicándose en el lugar 68 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nEn las últimas 4 semanas, <strong>se observa un deterioro estructural y sostenido en el desempeño, con una caída acumulada de -17,5 pts que confirma un retroceso estadísticamente significativo</strong>. Esto sugiere que, más allá del leve movimiento de la última semana, la experiencia viene perdiendo tracción de forma consistente y requiere contención operativa para evitar que la caída se siga profundizando.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 30,4 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a falta de stock y reposición en categorías específicas, junto con frustración por no encontrar productos habituales. Se sugiere reforzar reposición en horarios críticos, asegurar quiebres cero en categorías sensibles y activar un control diario de faltantes con responsables por sección.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 47,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a carne en mal estado, cortes que no corresponden y baja frescura en frutas y verduras en algunos casos. Se sugiere endurecer la revisión de calidad en sala y cámara, acelerar rotación y mermas, y reforzar el estándar de control en carnicería y perecibles en horarios de mayor venta.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 41,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a menor variedad en productos específicos y a una experiencia de surtido incompleta, especialmente cuando se combina con quiebres de stock. Se sugiere ajustar el mix por demanda local, revisar planogramas de categorías con más reclamos y asegurar sustitutos visibles cuando falte el producto principal.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 43,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a precios poco claros, rotulación ausente o confusa y diferencias entre lo exhibido y lo cobrado en caja. Se sugiere implementar una rutina diaria de verificación de flejes y cartelería, priorizar zonas de ofertas y rebajados, y reforzar el control de coherencia precio góndola versus caja.\n\n<strong>La c
