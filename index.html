<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Experiencia de Clientes - IA Conclusiones</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@800&display=swap');

/* --- PALETA Y ESTÉTICA IPSOS, TOMADA DEL HTML DE REFERENCIA --- */
:root {
    --ipsos-navy: #121B5A;
    --ipsos-teal: #1DAFAD;
    --ipsos-purple: #451B67;
    --ipsos-light-teal: #9FE5D8;
    --ipsos-dark-blue: #103C50;
    --ipsos-yellow: #E2DA51;
    --ipsos-orange: #FF740F;
    --ipsos-light-purple: #E3D8F0;
    --ipsos-light-blue: #A5CEE3;
    --ipsos-green: #2DB574;
    --ipsos-pink: #E50158;
    --ipsos-gray: #595959;
    --ipsos-light-gray: #E7EBF0;
    --ipsos-black: #000000;
    --ipsos-white: #FFFFFF;

    --bg-page: #F6F8FB;
    --text-dark: #26304D;
    --text-muted: #667085;
    --sidebar-width: 320px;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(18, 27, 90, 0.08);
    --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    --green-up: var(--ipsos-green);
    --red-down: var(--ipsos-pink);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0;
    font-family: 'Barlow', sans-serif;
    color: var(--ipsos-gray);
    background: radial-gradient(circle at top right, rgba(165, 206, 227, 0.30) 0%, transparent 32%), var(--bg-page);
    line-height: 1.6;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

.sidebar {
    width: var(--sidebar-width);
    background: var(--ipsos-navy);
    color: var(--ipsos-white);
    display: flex;
    flex-direction: column;
    height: 100%;
    flex-shrink: 0;
    box-shadow: 10px 0 30px rgba(18, 27, 90, 0.12);
    background-image: radial-gradient(circle at 90% 10%, var(--ipsos-dark-blue) 0%, transparent 50%);
}
.sidebar-header {
    padding: 22px 24px 28px 24px;
    border-bottom: 1px solid rgba(231, 235, 240, 0.15);
}
.brand-logo {
    display: block;
    width: 92px;
    height: auto;
    margin: 0 0 18px 0;
    border-radius: 2px;
}
.sidebar-header h2 {
    margin: 0;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 25px;
    line-height: 1;
    letter-spacing: 1px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--ipsos-white);
}
.sidebar-header p {
    margin: 8px 0 0 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--ipsos-teal);
}
.search-box {
    padding: 18px 16px;
    position: relative;
    border-bottom: 1px solid rgba(231, 235, 240, 0.12);
}
.search-box i {
    position: absolute;
    left: 30px;
    top: 31px;
    color: var(--ipsos-light-teal);
    opacity: .8;
}
.search-box input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(159,229,216,0.25);
    border-radius: 50px;
    padding: 12px 14px 12px 40px;
    color: var(--ipsos-white);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
    transition: var(--transition);
}
.search-box input:focus {
    border-color: var(--ipsos-teal);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 4px rgba(29, 175, 173, 0.12);
}
.search-box input::placeholder { color: rgba(255,255,255,0.55); }

.nav-container { flex: 1; overflow-y: auto; padding: 14px 0; }
.nav-item {
    margin: 4px 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    color: rgba(255,255,255,0.72);
    cursor: pointer;
    border-left: 4px solid transparent;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
}
.nav-item i { margin-right: 12px; width: 20px; text-align: center; color: var(--ipsos-light-teal); }
.nav-item:hover { background: rgba(255,255,255,0.08); color: var(--ipsos-white); transform: translateX(2px); }
.nav-item.active {
    background: rgba(29, 175, 173, 0.16);
    color: var(--ipsos-white);
    border-left-color: var(--ipsos-teal);
    font-weight: 700;
}

.main-content {
    flex: 1;
    overflow-y: auto;
    padding: 42px;
    box-sizing: border-box;
}
.container { max-width: 1180px; margin: 0 auto; }

.header-block {
    background: var(--ipsos-navy);
    color: var(--ipsos-white);
    border-radius: var(--radius);
    padding: 34px 38px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    background-image: radial-gradient(circle at 90% 10%, var(--ipsos-dark-blue) 0%, transparent 45%);
    border-left: 6px solid var(--ipsos-teal);
}
.header-block h1 {
    margin: 0;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 46px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--ipsos-white);
}

.period-timeline { display: flex; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
.period-badge {
    background: var(--ipsos-white);
    border: 1px solid var(--ipsos-light-gray);
    border-radius: var(--radius);
    padding: 13px 18px;
    display: flex;
    flex-direction: column;
    min-width: 150px;
    box-shadow: 0 6px 16px rgba(18, 27, 90, 0.05);
}
.period-badge .p-code { font-size: 12px; font-weight: 800; color: var(--ipsos-navy); letter-spacing: .4px; }
.period-badge .p-dates { font-size: 13px; color: var(--ipsos-gray); }
.period-badge.latest {
    border-color: var(--ipsos-teal);
    background: rgba(159, 229, 216, 0.22);
    position: relative;
}
.period-badge.latest .p-code { color: var(--ipsos-navy); }
.period-badge.latest::after {
    content: 'Último Período';
    position: absolute;
    top: -10px;
    right: 10px;
    background: var(--ipsos-teal);
    color: var(--ipsos-white);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 50px;
    font-weight: 700;
}

.report-card, .chart-container, .ranking-table-wrapper {
    background: var(--ipsos-white);
    border-radius: var(--radius);
    border: 1px solid var(--ipsos-light-gray);
    box-shadow: var(--shadow);
}
.report-card { padding: 34px; margin-bottom: 32px; }
.section-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--ipsos-navy);
    text-transform: uppercase;
    border-bottom: 1px solid var(--ipsos-light-gray);
    padding-bottom: 12px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    letter-spacing: .3px;
}
.section-title i { margin-right: 10px; color: var(--ipsos-teal); }
.section-text {
    font-size: 16px;
    line-height: 1.75;
    color: var(--ipsos-gray);
    margin-bottom: 32px;
    white-space: pre-line;
    text-align: justify;
}
.chart-container { padding: 26px; margin-bottom: 34px; height: 340px; position: relative; }

.ranking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
.ranking-table-wrapper { padding: 18px; }
.ranking-table-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--ipsos-navy);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: .3px;
}
.ranking-table-title i { color: var(--ipsos-teal); }
.ranking-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ranking-table th {
    text-align: left;
    padding: 10px 8px;
    background: rgba(231, 235, 240, 0.45);
    color: var(--ipsos-navy);
    font-weight: 700;
    border-bottom: 1px solid var(--ipsos-light-gray);
}
.ranking-table td {
    padding: 10px 8px;
    border-bottom: 1px solid rgba(231, 235, 240, 0.7);
    color: var(--ipsos-gray);
}
.ranking-table tr:last-child td { border-bottom: none; }
.badge-nps {
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 50px;
    background: rgba(29, 175, 173, 0.12);
    color: var(--ipsos-navy);
}
.badge-delta { font-weight: 800; }
.delta-pos { color: var(--green-up); }
.delta-neg { color: var(--red-down); }

@media (max-width: 900px) {
    body { display: block; height: auto; overflow: auto; }
    .sidebar { width: 100%; height: auto; max-height: 360px; }
    .main-content { padding: 24px; }
    .header-block h1 { font-size: 34px; }
    .ranking-grid { grid-template-columns: 1fr; }
}
</style>
</head>

const globalData = {"nombre": "Resumen General de la Red", "kpiEvolutivo": [48.4, 45.5, 43.8, 38.1], "comoLeFue": "La red cerró la <strong>última semana con un NPS promedio de 38,1 pts</strong>, bajando -5,7 pts respecto a la semana anterior, considerando un universo de 106 locales evaluados en su totalidad. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en el estándar global de atención.</strong> A nivel atomizado, el comportamiento inmediato de la última semana muestra que un <strong>49,1% de los locales</strong> experimentó una baja en su gestión, mientras que un 15,1% registró incrementos en sus niveles de servicio y el 35,8% restante se sostuvo sin variaciones de relevancia.\n\nMirando las últimas 4 semanas, la red arrastra un <strong>deterioro estructural en la percepción del cliente</strong>, acumulando una pérdida de -10,3 pts respecto al inicio del ciclo analizado.", "dondePonerFoco": "Los focos de gestión más recurrentes a nivel transversal son los siguientes: <strong>La disponibilidad de los productos</strong> aparece como la principal oportunidad de mejora al registrarse como foco en el 93,4% de los locales con una satisfacción neta promedio de 33,2 pts, seguido por <strong>La variedad de alternativas de productos</strong> que afecta al 80,2% de la red con 40,0 pts de satisfacción neta, y por <strong>El tiempo que esperaste en caja</strong>, presente en el 78,3% de los locales con 47,6 pts de satisfacción neta. En conjunto, estas demandas concentran una presencia crítica y repetitiva en la cadena, perfilando oportunidades de mejora transversales e inmediatas en los frentes de surtido comercial y en los procesos de comunicación hacia el cliente.", "prioridadesGestion": "La prioridad de gestión debería concentrarse en los focos transversales más repetidos y en las unidades que presentan mayores riesgos u oportunidades dentro de la red. En atención inmediata, los puntos de venta que exigen una intervención o auditoría urgente debido a sus bajos niveles de desempeño actual son <strong>0137 San Pablo, 0086 Recoleta y 0061 Maipu</strong>, mientras que las operaciones que representan el mayor riesgo de contagio en la red por arrastrar el deterioro acumulado más agudo del ciclo son <strong>0137 San Pablo, 0086 Recoleta y 0681 Pucon</strong>. En contraste, <strong>0081 Arica, 0747 Concon (Magallanes) y 0929 Puerto Montt (La Paloma)</strong> se consolidan como unidades de referencia estratégica que destacan por su excelencia operativa actual, y junto con <strong>0606 Lider Coronel, 0747 Concon (Magallanes) y 0098 Concepcion</strong> por sus sobresalientes saltos de mejora acumulada, posicionándose como los candidatos ideales para levantar y replicar buenas prácticas de servicio en el resto de la red."};

s de productos</strong> registró una satisfacción neta de 20,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Algunos comentarios apuntan a variedad limitada para necesidades específicas como sin gluten, sin azúcar, vegano y opciones “más saludables”, además de la percepción de “express” con surtido insuficiente. Se sugiere definir un listado corto de surtido mínimo por misión de compra y asegurar su presencia estable, con seguimiento semanal de quiebres en esas categorías.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 44,1 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a diferencias entre el precio exhibido y el cobrado en caja, ofertas que no aplican y falta de precios visibles en góndola, lo que genera fricción al pagar y trámites de devolución. Se sugiere implementar una rutina diaria de verificación de precios y flejes en categorías sensibles y reforzar un protocolo de resolución rápida en caja cuando exista discrepancia, con trato y disculpa explícita al cliente."}, {"id": "0002", "nombre": "0002 Pedro De Valdivia", "kpiEvolutivo": [26.4, 31.9, 27.3, 12.7], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 12,7 pts</strong>, bajando -14,5 pts respecto a la semana previa y ubicándose en el lugar 102 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas ue se encuentra bajo el rendimiento promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones frecuentes a “faltan productos”, reposición insuficiente y pasillos con operación de reponedores que dificulta encontrar y tomar productos. Se sugiere ajustar la planificación de reposición para evitar quiebres y despejar pasillos en horas punta, con responsables por zona y verificación de facing y stock crítico."}, {"id": "0015", "nombre": "0015 Estoril", "kpiEvolutivo": [45.9, 35.0, 34.0, 22.5], "comoLeFue": "El local cerró la última semana con un NPS de 22,5 pts, bajando -11,5 pts respecto a la semana previa y ubicándose en el lugar 92 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa una tendencia a la baja sostenida, con un deterioro estable que termina acumulando una contracción relevante.</strong> En concreto, el NPS cierra con una variación de -23,4 pts frente a la primera semana analizada, y este retroceso además es estadísticamente significativo, confirmando un debilitamiento estructural que requiere contención operativa.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 19,4 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana a ervicio y cierres anticipados de cajas rápidas. Se sugiere ajustar dotación y apertura de cajas según picos, mantener autoservicio operativo hasta el cierre cuando aplique y reforzar el rol de apoyo en autoservicio para destrabar incidencias sin frenar la fila.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 26,4 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparece alguna mención a menor variedad en categorías puntuales y a cambios de layout que dificultan encontrar productos, obligando a completar compras en otros comercios. Se sugiere asegurar surtido mínimo por categoría clave y mejorar señalética y comunicación en sala para orientar al cliente mientras se estabilizan los cambios de ubicación."}, {"id": "0033", "nombre": "0033 Calama", "kpiEvolutivo": [47.2, 34.9, 28.4, 13.6], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 13,6 pts</strong>, bajando -14,8 pts respecto a la semana previa y ubicándose en el lugar 100 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\nEn el acumulado de las últimas 4 semanas, <strong>se observa un deterioro estructural y sostenido en la experiencia, con una caída estable que termina consolidando un retroceso relevante</strong> de -33,6 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo que confirma el debilitamiento del indicador en el mediano plazo.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran Se sugiere ajustar dotación y apertura efectiva de cajas según flujo, activar planes de contingencia en fines de mes y reforzar apoyo visible en autoservicio para destrabar incidencias sin demoras."}, {"id": "0035", "nombre": "0035 Rancagua", "kpiEvolutivo": [45.2, 51.9, 47.2, 45.3], "comoLeFue": "El local cerró la última semana con un NPS de 45,3 pts, bajando -1,8 pts respecto a la semana previa y ubicándose en el lugar 36 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas, la gestión ha mostrado una trayectoria plana y de mejora muy acotada,</strong> cerrando con una variación marginal de +0,1 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística y que no altera el balance operacional. En la práctica, esto deja al local en un escenario donde sostener consistencia semana a semana es clave para evitar retrocesos y capturar mejoras incrementales.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 41,1 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. En comentarios se repiten menciones a falta de stock, estantes vacíos y reposición insuficiente en góndolas. Se sugiere reforzar la reposición en horarios críticos, asegurar quiebres cero en categorías sensibles y ordenar un control diario de faltantes con responsables por sala.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 44,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen menciones a que no se encuentra todo lo buscado y a una percepción de menor variedad en algunas categorías. Se sugiere revisar surtido por misión de compra, ajustar planogramas en categorías con más reclamos y asegurar sustitutos visibles cuando falte el producto principal.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 42,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y presenta una baja respecto a la semana anterior. Algunos comentarios apuntan a precios no visibles, diferencias entre el precio exhibido y el cobrado en caja, y falta de información precisa de ofertas. Se sugiere ejecutar una rutina diaria de verificación de flejes y cartelería, priorizar “precio correcto” en categorías de alta rotación y reforzar el apoyo en sala para resolver dudas antes de caja.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 51,8 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Se repiten menciones a filas, cajas colapsadas, pocas cajas habilitadas y fricción en autoservicio por falta de apoyo. Se sugiere ajustar dotación por franjas de alta demanda, habilitar más cajas cuando se disparen las filas y asignar un apoyo fijo en autoservicio para destrabar autorizaciones y errores de lectura.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 66,1 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Aparecen menciones puntuales pero relevantes sobre carne en mal estado, verduras deterioradas y problemas de conservación en algunos productos. Se sugiere reforzar controles de calidad por turno, asegurar cadena de frío y ejecutar retiros preventivos rápidos ante alertas de clientes.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 67,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios conviven reconocimientos a buena atención con menciones a trato inadecuado en casos puntuales, especialmente en interacción con guardias y algunas atenciones en caja. Se sugiere reforzar estándares de trato y resolución en primera línea, con foco en seguridad y cajas, y realizar retroalimentación breve en piso ante incidentes para corregir conductas de inmediato.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 73,2 pts en la última semana. Este atributo fue priorizado porque presenta una baja respecto a la semana anterior. Aparece alguna mención a fricciones asociadas al uso de carros y situaciones en estacionamiento vinculadas a carros. Se sugiere ordenar el circuito de recolección y disponibilidad en accesos, y reforzar control en estacionamiento para evitar incidentes y mejorar la experiencia de llegada."}, {"id": "0036", "nombre": "0036 Los Angeles", "kpiEvolutivo": [48.0, 50.5, 47.2, 33.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 33,3 pts</strong>, bajando -13,8 pts respecto a la semana previa y ubicándose en el lugar 75 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro sostenido y estable</strong>, cerrando con una contracción acumulada de -14,7 pts frente a la primera semana analizada. Este retroceso es estadísticamente significativo y confirma que la caída no es puntual, sino que viene consolidándose en el tiempo, elevando la presión sobre la gestión operativa para recuperar consistencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 51,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios aparece con fuerza la expectativa de “encontrar de todo”, pero también menciones a faltantes y a que algunos productos dejan de estar disponibles antes de lo esperado. Se sugiere reforzar la reposición en categorías sensibles y revisar quiebres recurrentes con un control diario de sala y bodega.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 56,2 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Si bien hay varias menciones positivas a amabilidad y buena atención, también aparecen casos de mala disposición y experiencias débiles en atención al cliente y postventa. Se sugiere alinear estándares de trato y resolución en puntos críticos, con refuerzo de supervisión en cajas, mesón y secciones de apoyo en horarios de mayor flujo.\n\n<strong>El tiempo que esperaste en caja</strong> registró una satisfacción neta de 43,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y presenta una baja respecto a la semana anterior. Se repiten menciones a pocas cajas abiertas en días peak, esperas prolongadas y fricción en autoservicio por máquinas que se traban o promociones que no cargan bien. Se sugiere ajustar dotación y apertura de cajas por tramos horarios, y asegurar soporte activo en autoservicio para destrabar equipos y validar promociones en el momento."}, {"id": "0037", "nombre": "0037 Matucana", "kpiEvolutivo": [49.3, 38.0, 37.8, 29.2], "comoLeFue": "El local cerró la última semana con un <strong>NPS de 29,2 pts</strong>, bajando -8,6 pts respecto a la semana previa y ubicándose en el lugar 85 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>En las últimas 4 semanas se observa un deterioro estructural y sostenido de la experiencia</strong>, cerrando con una pérdida acumulada de -20,1 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. La trayectoria muestra caídas que no lograron ser compensadas en los cortes intermedios, dejando al indicador en un nivel bajo y con presión operativa para recuperar consistencia.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 16,7 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, presenta un menor rendimiento en comparación con el resto de los locales y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a falta de variedad y a no encontrar productos específicos, junto con góndolas vacías o secciones con reposición insuficiente. Se sugiere reforzar reposición por quiebres críticos y ajustar el surtido en categorías recurrentes, con o promedio de los atributos de este local y presenta un menor rendimiento en comparación con el resto de los locales. Aparecen menciones a falta de carros en momentos de alta afluencia y a condiciones que afectan el inicio de la compra. Se sugiere asegurar un circuito de recuperación y redistribución de carros por franjas horarias, con apoyo en accesos y puntos críticos.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 72,7 pts en la última semana. Este atributo fue priorizado porque se incluye por su peso relativo dentro de los atributos evaluados. En comentarios se repiten valoraciones positivas por precios y ofertas, pero también aparecen fricciones por alzas percibidas y por diferencias entre precio en góndola y caja o falta de precios visibles. Se sugiere reforzar la ejecución de precios en sala con chequeos diarios de cartelería y consistencia góndola-caja, priorizando categorías sensibles como carnes y básicos de canasta."}, {"id": "0042", "nombre": "0042 Curico", "kpiEvolutivo": [64.0, 54.5, 53.6, 57.5], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 57,5 pts</strong>, subiendo +3,9 pts respecto a la semana previa y ubicándose en el lugar 5 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,8 pts en la última semana.\n\n<strong>En el balance de las últimas 4 semanas, se observa un deterioro sostenido y estable a la baja en la experiencia del cliente.</strong> El indicador acumula una contracción de -6,5 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo que confirma un debilitamiento estructural que la gestión debe contener.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 47,4 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local, ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a precios altos, pocas ofertas y diferencias entre precios publicados y cobrados. Se sugiere reforzar control de flejes y coherencia góndola-caja, y asegurar una parrilla mínima de ofertas visibles en categorías sensibles.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 57,9 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado. Aparecen comentarios sobre falta de ofertas, promociones poco visibles y confusión por condiciones como ofertas solo online o descuentos que no se encuentran en sala. Se sugiere mejorar señalética en sala y comunicación simple de condiciones, además de validar ejecución diaria de promociones en góndola y caja.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 81,6 pts en la última semana. Este atributo fue priorizado porque se incluye por su peso relativo dentro de los atributos evaluados. Aunque el nivel es alto, aparecen algunas menciones a menor disponibilidad o variedad en carnes y casos puntuales de productos en mal estado en entregas, lo que puede erosionar la percepción si se repite. Se sugiere asegurar reposición oportuna y control de calidad en perecibles, con foco en carnes y en el armado de pedidos para evitar quiebres y problemas de cadena de frío."}, {"id": "0043", "nombre": "0043 Plaza Maule", "kpiEvolutivo": [44.9, 50.3, 45.3, 26.3], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 26,3 pts</strong>, bajando -18,9 pts respecto a la semana previa y ubicándose en el lugar 89 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En las últimas 4 semanas, el local enfrenta una tendencia a la baja con comportamiento volátil</strong>, acumulando una contracción de -18,6 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. En la práctica, esto refleja una experiencia que no solo se deteriora en el balance, sino que además muestra inestabilidad entre semanas, dificultando sostener mejoras operativas de forma consistente.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 44,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a poco surtido y a falta de variedad, incluyendo casos puntuales de productos específicos no disponibles. Se sugiere reforzar reposición y amplitud de surtido en categorías sensibles, con revisión diaria de quiebres y sustitutos visibles en sala.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 48,3 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. En comentarios aparece con frecuencia la percepción de precios caros o más elevados que en otros locales, aunque también convive con menciones positivas a “buen precio” y acumulación de puntos. Se sugiere asegurar consistencia de precios clave versus competencia y reforzar comunicación de ahorros reales en góndola, priorizando canasta básica y productos de alta rotación.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 44,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado. Se repiten menciones a poca claridad en valores publicados y a ofertas que no se respetan en caja, incluyendo diferencias entre precio exhibido y cobrado. Se sugiere implementar un control diario de cartelera versus sistema y un protocolo de resolución rápida en caja para respetar precio publicado sin fricción para el cliente.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 62,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen algunas menciones a fruta en mal estado y carne descompuesta, que son incidentes de alto impacto aunque no sean mayoritarios. Se sugiere reforzar controles de calidad por turno, retiro preventivo de productos con merma visible y trazabilidad rápida ante reclamos en sala.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 44,8 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. En comentarios se repite “no encontré todo lo que buscaba” y falta de reposición, incluyendo productos en oferta y categorías específicas. Se sugiere atacar quiebres con reposición en horarios de mayor flujo, alertas de stock para ofertas y señalización de alternativas cuando un producto no esté disponible."}, {"id": "0044", "nombre": "0044 Quilin", "kpiEvolutivo": [57.4, 44.3, 48.4, 35.6], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 35,6 pts</strong>, bajando -12,8 pts respecto a la semana previa y ubicándose en el lugar 67 de 106 unidades evaluadas. <strong>Este descenso marca un quiebre estadísticamente significativo respecto al periodo previo, alertando sobre un debilitamiento directo en la percepción del cliente.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,6 pts en la última semana.\n\n<strong>En el acumulado de las últimas 4 semanas, se observa un deterioro estructural y sostenido</strong>, cerrando con una contracción de -21,8 pts frente a la primera semana analizada, con un movimiento estadísticamente significativo. Esto sugiere que la caída no es solo coyuntural de la última semana, sino que viene arrastrándose y requiere contención operativa para evitar que se siga profundizando.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 34,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a falta de stock y a no encontrar productos específicos, tanto en sala como en compras por app. Se sugiere reforzar reposición y quiebres por categorías críticas, con revisión diaria de top faltantes y sustituciones informadas cuando no haya stock.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 51,9 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a carnes en mal estado o con problemas de corte y grasa, además de casos de helados derretidos y productos vencidos. Se sugiere endurecer controles de calidad y cadena de frío en recepción y sala, con retiro preventivo y trazabilidad rápida ante reclamos para evitar recurrencia.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 53,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparecen menciones a precios ausentes o mal ubicados en góndola, demoras por verificación en caja y confusión con promociones que no se respetan. Se sugiere ejecutar una rutina de “precio visible y correcto” por pasillo, priorizando categorías de alta rotación y validando coherencia entre flejes, lector y caja antes de los horarios punta.\n\n<strong>La conveniencia de los precios</strong> registró una satisfacción neta de 59,6 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten comentarios sobre alzas de precios y percepción de menor competitividad versus otros supermercados, incluso con reclamos por diferencias entre web y sala. Se sugiere asegurar consistencia de precios entre canales y reforzar señalización de alternativas de buen precio, con foco en básicos y canasta sensible.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 44,2 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparecen menciones a poca variedad en algunas categorías y a no encontrar alternativas, especialmente en productos específicos y secciones puntuales. Se sugiere revisar surtido por categoría con quiebres recurrentes y ajustar planogramas en los pasillos más mencionados, asegurando alternativas visibles cuando falte la marca habitual.\n\n<strong>La atención entregada por el personal</strong> registró una satisfacción neta de 61,5 pts en la última semana. Este atributo fue priorizado porque presenta un menor rendimiento en comparación con el resto de los locales. Aunque hay menciones positivas a atención amable, también aparecen casos de trato poco empático y baja disposición, especialmente en autoservicio y ante problemas de boleta o validaciones. Se sugiere reforzar presencia y apoyo en cajas de autoservicio y entrenar respuestas estándar para contingencias, cuidando tono y resolución en primera interacción.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 73,1 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Si bien no es el principal dolor, aparece alguna mención a fricciones operativas en la experiencia de compra que se asocian a flujo y operación en sala. Se sugiere asegurar reposición y orden de carros en accesos en horarios punta, con responsable asignado por turno para evitar quiebres visibles."}, {"id": "0045", "nombre": "0045 Vespucio Maipu", "kpiEvolutivo": [63.9, 45.7, 43.9, 43.8], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 43,8 pts</strong>, bajando -0,1 pts respecto a la semana previa y ubicándose en el lugar 38 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>El local enfrenta un deterioro estructural y neto en la percepción del cliente al cierre de las últimas 4 semanas</strong>, acumulando una contracción de -20,1 pts desde la primera semana analizada, con un quiebre estadísticamente significativo que confirma un debilitamiento real y sostenido en el tiempo. Este retroceso deja poco espacio para compensaciones tácticas y exige foco en consistencia operativa para frenar la caída.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 47,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local y ha mostrado una baja durante el tiempo analizado, además de presentar una baja respecto a la semana anterior. Se repiten menciones a precios ilegibles, diferencias entre el precio publicado y el cobrado en caja y descuentos que no se respetan en autoservicio. Se sugiere reforzar control diario de flejes y cartelería, validación de precios en sistema antes de horas punta y un protocolo de resolución en caja que evite derivaciones y cierre el problema en el momento.\n\n<strong>La variedad de alternativas de productos</strong> registró una satisfacción neta de 54,8 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Aparecen comentarios sobre falta de variedad frente a otros formatos y categorías específicas que no se encuentran, además de frustración cuando el producto figura online pero no está disponible en sala. Se sugiere revisar surtido por categorías con más reclamos, asegurar reposición visible en sala y mejorar la orientación en pasillos para reducir la sensación de “no hay” cuando sí existe alternativa.\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 50,0 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado y presenta una baja respecto a la semana anterior. Se repiten menciones a quiebres de stock, góndolas vacías en productos en oferta y dificultad para encontrar apoyo del personal para ubicar productos. Se sugiere priorizar reposición en ofertas y básicos, reforzar presencia de apoyo en sala en horarios de mayor flujo y habilitar un punto simple de consulta de stock y ubicación para resolver rápido.\n\n<strong>Calidad y frescura de los productos perecibles</strong> registró una satisfacción neta de 71,4 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Se repiten menciones críticas a carne en mal estado y experiencias de devolución asociadas, lo que tensiona la confianza aun cuando el nivel actual sea alto. Se sugiere intensificar controles de cadena de frío y rotación, reforzar revisión en vitrina y empaque al inicio y cierre de turno, y asegurar una resolución de reclamos más contenedora y rápida en el mesón de atención."}, {"id": "0046", "nombre": "0046 Av. Central", "kpiEvolutivo": [47.0, 50.6, 49.2, 50.0], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 50,0 pts</strong>, subiendo +0,8 pts respecto a la semana previa y ubicándose en el lugar 21 de 106 unidades evaluadas. <strong>Si bien este avance se mantiene sin significancia estadística, marca un impulso favorable que contribuye a sostener los niveles de experiencia.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\n<strong>A lo largo de las últimas 4 semanas la gestión ha mostrado una trayectoria plana y lineal</strong>, consolidando un escenario de estancamiento en la experiencia del cliente, donde el indicador cierra con una variación marginal de +3,0 pts frente a la primera semana analizada, un movimiento menor que se mantiene sin significancia estadística y que no altera el balance operacional.", "dondePonerFoco": "No se observa un atributo que domine claramente la experiencia. Sin embargo, existen algunos focos que concentran las principales oportunidades de mejora:\n\n<strong>La disponibilidad de los productos</strong> registró una satisfacción neta de 52,6 pts en la última semana. Este atributo fue priorizado porque se encuentra bajo el rendimiento promedio de los atributos de este local. Algunos comentarios apuntan a quiebres de stock y góndolas vacías, además de faltantes puntuales en categorías como vestuario escolar y productos específicos. Se sugiere reforzar reposición en sala con revisión diaria de quiebres y un circuito rápido de sustitución o alternativas visibles cuando falte el producto.\n\n<strong>Disponibilidad de carros</strong> registró una satisfacción neta de 80,7 pts en la última semana. Este atributo fue priorizado porque ha mostrado una baja durante el tiempo analizado. Aparece alguna mención a carros en mal estado, lo que puede deteriorar la experiencia desde el inicio de la compra, especialmente en horarios de alta afluencia. Se sugiere implementar una rutina de inspección por turnos, retiro inmediato de carros defectuosos y reposición activa en accesos en horas punta.\n\n<strong>La claridad de las ofertas y promociones</strong> registró una satisfacción neta de 58,2 pts en la última semana. Este atributo fue priorizado porque se incluye por su peso relativo dentro de los atributos evaluados. Se repiten menciones a promociones poco claras o discrepancias entre el precio en góndola y el cobrado en caja, además de falta de señalización de ofertas en algunos productos. Se sugiere reforzar el control de flejes y cartelería antes de aperturas y cambios de campaña, y habilitar un chequeo rápido de precios en cajas para resolver diferencias en el momento."}, {"id": "0048", "nombre": "0048 Cordillera", "kpiEvolutivo": [56.3, 46.8, 43.7, 41.2], "comoLeFue": "El local cerró <strong>la última semana con un NPS de 41,2 pts</strong>, bajando -2,5 pts respecto a la semana previa y ubicándose en el lugar 46 de 106 unidades evaluadas. <strong>Si bien este descenso se mantiene sin significancia estadística, coloca al NPS en un nivel que sigue siendo desafiante para la gestión operativa.</strong> En comparación con el resto de locales, la red total presentó una baja de -5,7 pts en la última semana.\n\nE
